<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>몸짱소울</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C1716">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몸짱소울">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1716; --surface:#14262A; --soft:#1B3236; --edge:#070E0D; --line:#2B4a4E;
  --ink:#EAF5F1; --muted:#8FAEAA; --gold:#F6C445; --gold-ink:#2B2000; --link:#F6C445;
  --clear:#46E0A5; --clear-ink:#04241A; --boss:#FF6A5B;
  --accent:var(--gold); --accent-ink:var(--gold-ink); --marker:var(--gold);
  --disp:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E8F1EE; --surface:#FFFFFF; --soft:#E2EEEA; --edge:#B7CBC4; --line:#C8DBD4;
    --ink:#10231F; --muted:#4D6964; --gold:#F1B90F; --gold-ink:#2B2000; --link:#8A5A00;
    --clear:#1FBF86; --clear-ink:#032117; --boss:#DC3E31;
  }
}
:root[data-theme="light"]{
  --bg:#E8F1EE; --surface:#FFFFFF; --soft:#E2EEEA; --edge:#B7CBC4; --line:#C8DBD4;
  --ink:#10231F; --muted:#4D6964; --gold:#F1B90F; --gold-ink:#2B2000; --link:#8A5A00;
  --clear:#1FBF86; --clear-ink:#032117; --boss:#DC3E31;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
.wrap{max-width:560px; margin:0 auto; padding:18px 16px 170px;}
.eyebrow{color:var(--muted); font-size:14px; margin:0 2px 8px; font-weight:500;}
h1{font-family:var(--disp); font-weight:400; font-size:36px; line-height:1.15; margin:0;}
h1.ph{margin:22px 2px 6px;}
h2{font-family:var(--disp); font-weight:400; font-size:19px; margin:26px 2px 10px; padding-left:10px; border-left:4px solid var(--gold); line-height:1.2;}
h2 .cnt{color:var(--muted); font-size:15px; margin-left:6px;}
h3{margin:0;}

/* HUD */
.hud{display:flex; gap:14px; align-items:center; background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:12px 14px; box-shadow:0 4px 0 var(--edge); margin:0 0 16px;}
.lv{flex:none; width:64px; height:70px; background:var(--gold); color:var(--gold-ink); display:grid; place-content:center; text-align:center;
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%); font-family:var(--disp); line-height:1;}
.lv span{font-size:12px;} .lv b{font-size:30px; font-weight:400;}
.hud-main{flex:1; min-width:0;}
.hud-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.ttl{font-family:var(--disp); font-size:19px;}
.stk{font-size:13px; color:var(--muted); white-space:nowrap;}
.stk b{font-family:var(--disp); font-size:19px; color:var(--link); font-weight:400;}
.xpbar{height:12px; border-radius:6px; background:var(--soft); overflow:hidden; margin:6px 0 4px; border:1px solid var(--line);}
.xpbar i{display:block; height:100%; background:var(--gold); border-radius:6px; transition:width .4s ease;}
.xpbar.big{height:16px; margin:14px 0 6px;}
.xpt{display:flex; justify-content:space-between; font-size:12px; color:var(--muted);}

/* quest banner */
.quest{position:relative; background:var(--surface); border:2px solid var(--gold); border-radius:24px; padding:18px 18px 16px; box-shadow:0 5px 0 var(--edge); overflow:hidden;}
.quest.boss{border-color:var(--boss);}
.quest.cleared{border-color:var(--clear);}
.qk{font-size:13px; font-weight:700; color:var(--link); margin:0 0 2px;}
.quest.boss .qk{color:var(--boss);}
.quest.cleared .qk{color:var(--clear);}
.qs{font-size:14px; color:var(--muted); margin:6px 0 14px;}
.qs b{color:var(--ink);}
.segs{display:flex; gap:4px;}
.segs i{flex:1; height:14px; border-radius:4px; background:var(--soft); border:1px solid var(--line);}
.segs i.on{background:var(--clear); border-color:var(--clear);}
.qm{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; font-size:13px; color:var(--muted);}
.qm b{font-family:var(--disp); font-size:24px; font-weight:400; color:var(--ink);}
.stamp{position:absolute; top:16px; right:16px; transform:rotate(8deg); border:3px solid var(--clear); color:var(--clear);
  font-family:var(--disp); font-size:22px; padding:0 10px; border-radius:8px; letter-spacing:.05em; line-height:1.3;}

/* quest cards */
.q{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:4px 16px; box-shadow:0 4px 0 var(--edge); margin:0 0 14px;}
.q.ok{border-color:var(--clear);}
.row{display:flex; align-items:center; gap:14px; width:100%; min-height:62px; padding:10px 0; background:none; border:0; text-align:left;}
.row + .row{border-top:1px solid var(--line);}
.box{flex:none; width:30px; height:30px; border-radius:10px; border:2px solid var(--line); display:grid; place-items:center; color:transparent; font-weight:900; font-size:16px;}
.row[aria-pressed="true"] .box{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.row[aria-pressed="true"] .rt{color:var(--muted);}
.row[disabled]{opacity:.55; cursor:default;}
.rt{font-weight:700; flex:1; min-width:0;}
.rs{display:block; font-size:13px; color:var(--muted); font-weight:400;}
.rew{flex:none; margin-left:auto; font-family:var(--disp); font-size:14px; padding:1px 10px; border-radius:999px; background:var(--gold); color:var(--gold-ink); line-height:22px; white-space:nowrap;}
.rew.ok{background:var(--clear); color:var(--clear-ink);}
.ex{padding:16px;}
.ex-head{display:flex; align-items:center; gap:12px;}
.idx{flex:none; width:30px; height:30px; border-radius:10px; background:var(--soft); color:var(--link); font-family:var(--disp); font-size:18px; display:grid; place-items:center; line-height:1;}
.ex-name{font-family:var(--disp); font-weight:400; font-size:21px; flex:1; min-width:0; word-break:keep-all; line-height:1.25;}
.desc{margin:8px 0 0; font-size:14px; color:var(--muted);}
.dose{margin:8px 0 0; font-size:14px; color:var(--muted);}
.dose b{font-family:var(--disp); font-size:19px; color:var(--link); font-weight:400;}
.sets{display:flex; gap:10px; margin:14px 0 4px; flex-wrap:wrap;}
.set{min-width:64px; height:54px; border-radius:16px; border:2px solid var(--line); background:var(--soft); font-family:var(--disp); font-size:24px; line-height:1; box-shadow:0 3px 0 var(--edge);}
.set.wide{min-width:110px; font-size:20px;}
.set[aria-pressed="true"]{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.pop{animation:pop .3s ease-out;}
@keyframes pop{0%{transform:scale(.82);}60%{transform:scale(1.14);}100%{transform:scale(1);}}
.tipbtn{background:none; border:0; padding:8px 0 4px; color:var(--link); font-weight:700; font-size:14px; min-height:44px;}
.tips{margin:0 0 6px; padding:12px 16px 12px 32px; background:var(--soft); border-radius:14px; font-size:14px;}
.tips li{margin:2px 0;}
.var{margin:8px 0 0; font-size:13px; color:var(--muted); padding-left:0; list-style:none;}
.push{color:var(--ink); font-weight:700;}
.note{font-size:13px; color:var(--muted); margin:2px 4px 0;}
.figs{display:flex; gap:8px; margin:10px 0 4px;}
svg.fig{width:100%; height:auto; display:block; background:var(--soft); border-radius:14px;}
.vid{display:inline-block; margin:2px 0 4px; color:var(--link); font-weight:700; font-size:14px; min-height:44px; line-height:44px;}
.fcap{font-size:12px; color:var(--muted); text-align:center; margin:2px 0 0;}
.card{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:4px 16px; box-shadow:0 4px 0 var(--edge);}

/* map (week) */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 6px;}
.stat{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:14px 16px; box-shadow:0 4px 0 var(--edge);}
.stat b{display:block; font-family:var(--disp); font-weight:400; font-size:38px; color:var(--link); line-height:1.1;}
.stat span{font-size:13px; color:var(--muted);}
.map{position:relative; margin-top:14px;}
.map::before{content:""; position:absolute; left:27px; top:28px; bottom:28px; width:4px; background:var(--line); border-radius:2px;}
.node-row{position:relative; display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:none; border:0; padding:8px 0; min-height:64px;}
.node{flex:none; width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--soft); border:3px solid var(--line); font-family:var(--disp); font-size:22px; z-index:1;}
.node-row.clr .node{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.node-row.now .node{border-color:var(--gold); box-shadow:0 0 0 4px var(--surface), 0 0 0 7px var(--gold);}
.node-row.boss .node{border-color:var(--boss);}
.node-row.boss:not(.clr) .node{color:var(--boss);}
.info{flex:1; min-width:0; background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:10px 14px; display:block;}
.node-row.now .info{border-color:var(--gold);}
.info b{font-family:var(--disp); font-weight:400; font-size:19px; display:block; line-height:1.25;}
.info small{display:block; color:var(--muted); font-size:13px;}
.dpct{font-family:var(--disp); font-size:17px; min-width:52px; text-align:right;}
.node-row.clr .dpct{color:var(--clear);}
.mini{display:block; height:6px; border-radius:3px; background:var(--soft); margin-top:8px; overflow:hidden;}
.mini i{display:block; height:100%; background:var(--clear); border-radius:3px;}

/* achievements */
.achs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.ach{background:var(--surface); border:2px solid var(--gold); border-radius:16px; padding:12px; box-shadow:0 3px 0 var(--edge);}
.ach.lock{border-color:var(--line); opacity:.62;}
.ai{width:36px; height:36px; border-radius:50%; background:var(--gold); color:var(--gold-ink); display:grid; place-items:center; font-family:var(--disp); font-size:19px; margin-bottom:6px;}
.ach.lock .ai{background:var(--soft); color:var(--muted);}
.ach b{display:block; font-family:var(--disp); font-weight:400; font-size:17px; line-height:1.25;}
.ach small{display:block; font-size:12px; color:var(--muted); line-height:1.4; margin-top:2px;}

/* record */
.field{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
.field label{flex:1 1 90px; font-size:13px; color:var(--muted);}
.field input{display:block; width:100%; margin-top:4px; height:50px; border-radius:14px; border:2px solid var(--line); background:var(--soft); color:var(--ink); padding:0 12px; font:inherit;}
.primary{width:100%; min-height:54px; border-radius:16px; border:0; background:var(--gold); color:var(--gold-ink); font-family:var(--disp); font-size:19px; margin-top:6px; box-shadow:0 4px 0 var(--edge);}
.ghost{min-height:44px; border-radius:14px; border:2px solid var(--line); background:none; padding:0 16px; font-weight:500;}
.ghost.warn{border-color:var(--boss); color:var(--boss);}
.chart-title{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; padding:12px 0 0;}
.chart-title b{font-weight:700;}
.chart-title span{font-family:var(--disp); font-size:22px; color:var(--link);}
svg.chart{width:100%; height:auto; display:block;}
.empty{color:var(--muted); font-size:14px; margin:10px 0;}
.hist{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; font-size:14px;}
.hist + .hist{border-top:1px solid var(--line);}
.del{background:none; border:0; color:var(--muted); min-height:44px; padding:0 8px; text-decoration:underline;}

/* timer, toast, nav, overlay */
.timer{position:fixed; left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:536px;
  bottom:calc(88px + env(safe-area-inset-bottom,0px)); background:var(--surface); border:2px solid var(--gold); color:var(--ink);
  border-radius:18px; padding:10px 14px; display:flex; align-items:center; gap:12px; z-index:20; box-shadow:0 4px 0 var(--edge);}
.timer[hidden]{display:none;}
.tlab{font-size:13px; color:var(--muted); font-weight:700;}
.timer .tnum{font-family:var(--disp); font-size:38px; min-width:52px; line-height:1; color:var(--link); font-variant-numeric:tabular-nums;}
.timer .tbar{flex:1; height:10px; border-radius:5px; background:var(--soft); overflow:hidden;}
.timer .tbar i{display:block; height:100%; background:var(--gold); width:0; transition:width .25s linear; border-radius:5px;}
.timer button{min-height:44px; border-radius:14px; border:2px solid var(--line); background:none; padding:0 14px; font-weight:700;}
.toast{position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + env(safe-area-inset-top,0px)); z-index:60;
  background:var(--gold); color:var(--gold-ink); font-family:var(--disp); font-size:19px; padding:6px 18px; border-radius:999px; box-shadow:0 4px 0 var(--edge); max-width:calc(100% - 24px); text-align:center;}
.toast[hidden]{display:none;}
.toast.show{animation:tin .25s ease-out;}
@keyframes tin{from{transform:translate(-50%,-14px); opacity:0;}to{transform:translate(-50%,0); opacity:1;}}
.nav{position:fixed; left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:536px;
  bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:6px; padding:6px;
  background:var(--surface); border:2px solid var(--line); border-radius:22px; box-shadow:0 4px 0 var(--edge); z-index:30;}
.nav button{flex:1; min-height:52px; border:0; border-radius:16px; background:none; font-family:var(--disp); font-size:19px; color:var(--muted);}
.nav button[aria-current="page"]{background:var(--gold); color:var(--gold-ink);}
.ov{position:fixed; inset:0; z-index:50; background:rgba(3,10,9,.8); display:grid; place-items:center; padding:20px;}
.ov[hidden]{display:none;}
#cf{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.ovc{position:relative; width:100%; max-width:380px; background:var(--surface); border:3px solid var(--gold); border-radius:28px; padding:26px 22px 22px; text-align:center; box-shadow:0 8px 0 var(--edge); animation:drop .3s ease-out;}
@keyframes drop{from{transform:translateY(24px) scale(.9); opacity:0;}to{transform:none; opacity:1;}}
.ovk{font-family:var(--disp); letter-spacing:.1em; color:var(--link); font-size:18px; margin:0;}
.ovh{font-family:var(--disp); font-weight:400; font-size:34px; margin:4px 0 8px; padding:0; border:0; line-height:1.2;}
.lab{margin:6px 0 0; font-size:13px; color:var(--muted);}
.bigxp{font-family:var(--disp); font-size:60px; color:var(--link); line-height:1.1; margin:0;}
.lvup{margin:8px 0 0; font-size:16px;} .lvup b{font-family:var(--disp); font-weight:400; font-size:22px; color:var(--link);}
.achl{margin:8px 0 0; display:inline-block; background:var(--soft); border-radius:999px; padding:2px 14px; font-size:14px; font-weight:700;}
.xpt2{margin:0 0 16px; font-size:13px; color:var(--muted);}
@media (prefers-reduced-motion: reduce){
  .xpbar i,.timer .tbar i,.pop,.ovc,.toast.show{transition:none; animation:none;}
}

/* 보스전 */
.bossrule{margin-top:14px; border-top:2px dashed var(--line); padding-top:12px;}
.pips{display:flex; gap:6px;}
.pip{flex:1; text-align:center; font-family:var(--disp); font-size:16px; padding:4px 0; border-radius:10px; background:var(--soft); border:2px solid var(--line); color:var(--muted);}
.pip.on{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.bossrule p{font-size:12px; color:var(--muted); margin:8px 0 10px;}
.stamp.r-draw{border-color:var(--gold); color:var(--link);}
.stamp.r-lose{border-color:var(--boss); color:var(--boss);}
.quest.cleared.r-draw{border-color:var(--gold);}
.quest.cleared.r-lose{border-color:var(--boss);}
.node-row.draw .node{background:var(--gold); border-color:var(--gold); color:var(--gold-ink);}
.node-row.lose .node{background:var(--boss); border-color:var(--boss); color:#fff;}
.node-row.draw .dpct{color:var(--link);}
.node-row.lose .dpct{color:var(--boss);}
.ovc[data-mode="draw"]{border-color:var(--muted);}
.ovc[data-mode="lose"]{border-color:var(--boss);}
.ovc[data-mode="lose"] .ovk{color:var(--boss);}
.ovc[data-mode="draw"] .ovk{color:var(--muted);}
.scene{width:100%; height:auto; display:block; margin:8px 0 10px; border-radius:22px;}
.bnote{font-size:14px; margin:0 0 6px;}
.a-bob{animation:bob .7s ease-in-out infinite alternate;}
@keyframes bob{to{transform:translateY(-9px);}}
.a-spin{animation:spinx 3.2s linear infinite; transform-box:fill-box; transform-origin:center;}
@keyframes spinx{to{transform:rotate(360deg);}}
.a-twk{animation:twk 1.2s ease-in-out infinite alternate;}
@keyframes twk{from{opacity:1;}to{opacity:.3;}}
.a-fall{animation:fall .6s ease-in both;}
@keyframes fall{from{transform:rotate(-30deg) translateY(-14px);}to{transform:none;}}
.a-back{animation:backl .9s ease-out both;}
@keyframes backl{from{transform:translateX(26px);}to{transform:none;}}
.a-back2{animation:backr .9s ease-out both;}
@keyframes backr{from{transform:translateX(-26px);}to{transform:none;}}
@media (prefers-reduced-motion: reduce){
  .a-bob,.a-spin,.a-twk,.a-fall,.a-back,.a-back2{animation:none;}
}

/* 모험 지도 */
.gmap{position:relative; width:100%; aspect-ratio:360/1370; border-radius:26px; border:2px solid var(--line); box-shadow:0 4px 0 var(--edge); overflow:hidden; margin:16px 0 8px; background:#BFE3B4;}
.mapsvg{position:absolute; inset:0; width:100%; height:100%; display:block;}
.stg{position:absolute; background:none; border:0; padding:0; border-radius:18px; cursor:pointer;}
.stg:focus-visible{outline:3px solid var(--gold); outline-offset:-3px;}
.plate{position:absolute; left:50%; bottom:0; transform:translateX(-50%); background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:2px 10px 3px; text-align:center; white-space:nowrap; box-shadow:0 3px 0 var(--edge);}
.plate b{display:block; font-family:var(--disp); font-weight:400; font-size:15px; line-height:1.3; color:var(--ink);}
.plate small{display:block; font-size:11px; color:var(--muted); line-height:1.3;}
.stg.boss .plate{border-color:var(--boss);}
.stg.clr .plate{border-color:var(--clear);}
.stg.draw .plate{border-color:var(--gold);}
.stg.lose .plate{border-color:var(--boss);}
.stg.now .plate{background:var(--gold); border-color:var(--gold);}
.stg.now .plate b,.stg.now .plate small{color:var(--gold-ink);}

/* 퀘스트 배너 장소 그림 */
.qtop{display:flex; align-items:center; gap:10px;}
.qtext{flex:1; min-width:0;}
.qimg{flex:none; width:112px; height:96px; display:block;}
.quest h1{font-size:32px; word-break:keep-all;}
.stamp{position:static; display:inline-block; margin-left:10px; transform:rotate(-5deg); font-size:16px; padding:0 8px; border-width:2px; border-radius:6px; vertical-align:middle; line-height:1.4;}

/* 거리 입력 · 전날/다음날 */
.kmrow{display:flex; align-items:center; gap:10px; padding:10px 0 14px; border-top:1px solid var(--line);}
.kmrow label{flex:1; font-size:14px; color:var(--muted);}
.kmrow input{width:100px; height:48px; border-radius:12px; border:2px solid var(--line); background:var(--soft); color:var(--ink); font-family:var(--disp); font-size:22px; text-align:center; padding:0 8px;}
.kmrow span{font-family:var(--disp); font-size:18px; color:var(--link);}
.stat b em{font-style:normal; font-size:16px; color:var(--hero-muted,var(--muted)); margin-left:3px;}

var BOSSES={mon:{k:'ogre',n:'상체짱 오우거'},tue:{k:'spider',n:'하체짱 왕거미'},wed:{k:'golem',n:'코어짱 골렘'},thu:{k:'wolf',n:'어깨짱 워울프'},fri:{k:'mino',n:'벅지짱 미노타우르스'},sat:{k:'demon',n:'전신짱 마왕'}};
var SAT_GOAL=1000;
function weekdayXP(d){
  var mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)), t=0, i;
  for(i=0;i<5;i++){ t+=dayXP(fmt(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i))); }
  return t;
}
function satWin(d){return weekdayXP(d)>=SAT_GOAL;}
function dayResult(d){
  var dk=DK[d.getDay()], L=rd(fmt(d)), done=isDone(d);
  if(dk==='sun') return L.ended?{res:'bless'}:null;
  if(dk==='sat'){
    var x=weekdayXP(d);
    if(done) return {res:x>=SAT_GOAL?'win':'lose',xp:x,why:x>=SAT_GOAL?'':'xp'};
    if(L.ended) return {res:'lose',xp:x,why:'ended'};
    return null;
  }
  if(done) return {res:'win'};
  if(L.ended) return {res:'lose',why:'ended'};
  return null;
}

  if(dk==='sun') return '가호';

/* ---------- 상태 ---------- */
function pad(n){return n<10?'0'+n:''+n;}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);}
var NOW = new Date();
var TODAY = new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
function fresh(){return {start:fmt(TODAY),log:{},body:[]};}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw); if(o && o.log && o.body && o.start) return o;}
  }catch(e){}
  return fresh();
}
var CL={ready:false,fail:false,user:null,busy:false,again:false,timer:null,stat:'',msg:'',err:false,last:0};
var noDirty=false;
var S = load();
function save(){
  if(!noDirty) S.dirty=true;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(!noDirty && CL.user) cloudSchedule();
}

var armed = false;

function rd(k){return S.log[k]||{done:{},diet:{},out:false};}
function wr(k){if(!S.log[k]) S.log[k]={done:{},diet:{},out:false}; return S.log[k];}
function weekNo(){
  var diff = Math.floor((TODAY - parse(S.start))/86400000);
  return Math.max(1, Math.floor(diff/7)+1);
}
function stageIdx(){var w=weekNo(); return w<=2?0:(w<=4?1:2);}
function idsFor(dk){
  var p = PLAN[dk], out=['run'];
  p.ex.forEach(function(id){
    var n = X[id].one?1:SETS;
    for(var i=1;i<=n;i++) out.push(id+'-'+i);
  });
  return out;
}
function count(d){
  var k=fmt(d), ids=idsFor(DK[d.getDay()]), L=rd(k), n=0;
  ids.forEach(function(i){if(L.done[i]) n++;});
  return {done:n,total:ids.length};
}
function isDone(d){var c=count(d); return c.done===c.total;}
function streak(){
  var d = TODAY, n = 0;
  if(!isDone(d)) d = addDays(d,-1);
  for(var i=0;i<400;i++){ if(isDone(d)){n++; d=addDays(d,-1);} else break; }
  return n;
}
function weekStart(){return addDays(TODAY,-((TODAY.getDay()+6)%7));}
function longDate(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DAYS[d.getDay()]+'요일';}
function stageText(st){return STAGES[st].split(' · ')[1];}

/* 경험치·업적 */
function dayXP(k){
  var L=S.log[k]; if(!L) return 0;
  var d=parse(k), xp=0;
  idsFor(DK[d.getDay()]).forEach(function(id){ if(L.done[id]) xp += (id==='run'?XP_RUN:XP_SET); });
  if(L.diet){ if(L.diet.lunch) xp+=XP_MEAL; if(L.diet.post) xp+=XP_MEAL; if(L.diet.water) xp+=XP_MEAL; }
  if(isDone(d)){ xp+=XP_CLEAR; var dkk=DK[d.getDay()]; if(dkk==='sat'){ if(satWin(d)) xp+=BOSS_WIN_XP; } else if(dkk!=='sun'){ xp+=MID_XP; } }
  return xp;
}
function totalXP(){var t=0; Object.keys(S.log).forEach(function(k){t+=dayXP(k);}); return t;}
function clearedKeys(){return Object.keys(S.log).filter(function(k){return isDone(parse(k));}).sort();}
function bestStreak(){
  var best=0, run=0, prev=null;
  clearedKeys().forEach(function(k){
    var d=parse(k);
    if(prev && Math.round((d-prev)/86400000)===1) run++; else run=1;
    if(run>best) best=run; prev=d;
  });
  return best;
}

var BSTEPS=[1,5,10,30,50,100];
function bossChain(id,key,dk,nm){
  return {id:id,b:key,steps:BSTEPS,unit:'회',count:function(c){return dk==='sat'?c.boss:c.kills[dk];},name:function(n){return nm+' 토벌 '+n+'회';}};
}
var CHAINS=[
  {id:'streak',b:null,steps:[3,7,30,100,300,365],unit:'일',count:function(c){return c.best;},
   name:function(n){return ({3:'3일 연속 클리어',7:'일주일 개근',30:'한 달 개근',100:'100일 개근',300:'300일 개근',365:'1년 개근'})[n];}},
  bossChain('c_demon','demon','sat','전신짱 마왕'),
  bossChain('c_mon','ogre','mon','상체짱 오우거'),
  bossChain('c_tue','spider','tue','하체짱 왕거미'),
  bossChain('c_wed','golem','wed','코어짱 골렘'),
  bossChain('c_thu','wolf','thu','어깨짱 워울프'),
  bossChain('c_fri','mino','fri','벅지짱 미노타우르스')
];
function achState(c){
  var out=[];
  CHAINS.forEach(function(ch){
    var cur=ch.count(c), done=0;
    ch.steps.forEach(function(st){ if(cur>=st) done++; });
    var all=(done===ch.steps.length);
    out.push({kind:'chain',ch:ch,cur:cur,done:done,all:all,next:all?ch.steps[ch.steps.length-1]:ch.steps[done],total:ch.steps.length});
  });
  ACH.forEach(function(a){ out.push({kind:'one',a:a,on:!!a.t(c)}); });
  return out;
}
function gstats(){
  var ks=clearedKeys(), sets=0, runs=0, boss=0;
  Object.keys(S.log).forEach(function(k){
    var L=S.log[k];
    Object.keys(L.done).forEach(function(id){ if(L.done[id]){ if(id==='run') runs++; else sets++; } });
  });
  ks.forEach(function(k){ if(DK[parse(k).getDay()]==='sat' && satWin(parse(k))) boss++; });
  var kills={mon:0,tue:0,wed:0,thu:0,fri:0}, wk={}, bless=0, weekAll=false;
  ks.forEach(function(k){
    var dd=parse(k), dk=DK[dd.getDay()];
    if(kills[dk]!=null){ kills[dk]++; var mk=fmt(addDays(dd,-((dd.getDay()+6)%7))); wk[mk]=(wk[mk]||0)+1; }
  });
  Object.keys(wk).forEach(function(k){ if(wk[k]>=5) weekAll=true; });
  Object.keys(S.log).forEach(function(k){ if(S.log[k].ended && DK[parse(k).getDay()]==='sun') bless++; });
  var killTotal=kills.mon+kills.tue+kills.wed+kills.thu+kills.fri;
  return {days:ks.length,best:bestStreak(),sets:sets,runs:runs,boss:boss,kills:kills,killTotal:killTotal,weekAll:weekAll,bless:bless,km:kmSum(),lv:lvInfo(totalXP()).L,
          weights:S.body.filter(function(b){return b.weight!=null;}).length};
}
function unlocked(){
  var c=gstats(), o={};
  ACH.forEach(function(a){ if(a.t(c)) o[a.id]=a.n; });
  CHAINS.forEach(function(ch){ var cur=ch.count(c); ch.steps.forEach(function(st){ if(cur>=st) o[ch.id+':'+st]=ch.name(st); }); });
  return o;
}
function snap(){var xp=totalXP(); return {xp:xp, lv:lvInfo(xp).L, ach:unlocked(), done:isDone(sel)};}

function rewChip(x,done){
  if(done) return '<span class="rew ok">CLEAR</span>';
  if(x===0) return '<span class="rew none">XP 없음</span>';
  return '<span class="rew">+'+x+' XP</span>';
}
function check(on,label,sub,act,extra,dis,rew){
  return '<button type="button" class="row" aria-pressed="'+(on?'true':'false')+'" data-a="'+act+'" '+extra+(dis?' disabled':'')+'>'+
    '<span class="box" aria-hidden="true">✓</span>'+
    '<span class="rt">'+label+(sub?'<span class="rs">'+sub+'</span>':'')+'</span>'+(rew!=null?rewChip(rew,on):'')+'</button>';
}
function kmEntries(){
  return Object.keys(S.log).filter(function(k){return S.log[k].km>0;}).sort().map(function(k){return {k:k,v:S.log[k].km};});
}
function kmSum(a,b){
  var t=0; kmEntries().forEach(function(e){ if((!a||e.k>=a)&&(!b||e.k<=b)) t+=e.v; }); return t;
}

function chart(pts,label,unit){
  if(pts.length<2) return '<p class="empty">'+label+' 기록이 2개 이상이면 그래프가 나타나요.</p>';
  var W=320,H=110,P=16, vs=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(mn===mx){mn-=1;mx+=1;}
  var x=function(i){return P+i*(W-2*P)/(pts.length-1);};
  var y=function(v){return H-P-(v-mn)*(H-2*P)/(mx-mn);};
  var line=pts.map(function(p,i){return x(i).toFixed(1)+','+y(p.v).toFixed(1);}).join(' ');
  var dots=pts.map(function(p,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.5" fill="var(--clear)"/>';}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+' 변화 그래프">'+
    '<polyline points="'+line+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+
    '<text x="'+P+'" y="12" font-size="10" fill="var(--muted)">'+mx+unit+'</text>'+
    '<text x="'+P+'" y="'+(H-2)+'" font-size="10" fill="var(--muted)">'+mn+unit+'</text></svg>';
}


/* ---------- 백업 · 복원 ---------- */
var bkMode=null, bkText='', bkPending=null, bkErr='';
function bkNow(){var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function bkName(){return 'momjjang-soul-backup-'+bkNow()+'.json';}
function bkStamp(){try{localStorage.setItem('home-training-backup-at',new Date().toISOString());}catch(e){}}
function bkLast(){
  try{
    var v=localStorage.getItem('home-training-backup-at'); if(!v) return '';
    var d=new Date(v); return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }catch(e){return '';}
}
function bkBuild(){return JSON.stringify({app:'momjjang-soul',v:1,at:new Date().toISOString(),data:S});}
function bkParse(text){
  var o; try{o=JSON.parse(text);}catch(e){return {err:'백업 내용을 읽을 수 없어요. 파일이나 붙여넣은 글자를 확인해 주세요.'};}
  var d=(o&&o.data)?o.data:o;
  if(!d||typeof d!=='object'||!d.log||typeof d.log!=='object'||!Array.isArray(d.body)) return {err:'몸짱소울 백업이 아니에요.'};
  var ok=/^\d{4}-\d{2}-\d{2}$/, log={};
  Object.keys(d.log).forEach(function(k){
    var L=d.log[k];
    if(ok.test(k)&&L&&typeof L==='object'){
      log[k]={done:(L.done&&typeof L.done==='object')?L.done:{},diet:(L.diet&&typeof L.diet==='object')?L.diet:{},out:!!L.out};
      if(L.km>0) log[k].km=+L.km;
      if(L.ended) log[k].ended=true;
      if(L.cleared) log[k].cleared=true;
    }
  });
  var body=d.body.filter(function(b){return b&&ok.test(b.date)&&typeof b.weight==='number';}).map(function(b){return {date:b.date,weight:b.weight};});
  var start=(typeof d.start==='string'&&ok.test(d.start))?d.start:fmt(TODAY);
  return {data:{start:start,log:log,body:body}};
}
function bkCheck(text){
  var r=bkParse((text||'').trim());
  if(r.err){bkErr=r.err; bkPending=null;} else{bkErr=''; bkPending=r.data;}
  render();
}
function bkFile(f){
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){bkCheck(String(fr.result||''));};
  fr.onerror=function(){bkErr='파일을 읽지 못했어요.'; render();};
  fr.readAsText(f);
}
function bkCopyFallback(){
  var ta=document.getElementById('bktext'), ok=false;
  try{ ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length); ok=document.execCommand('copy'); }catch(e){}
  if(ok){bkStamp(); render(); toast('복사했어요');} else{toast('글자를 길게 눌러 직접 복사해 주세요');}
}
function bkAction(a){
  if(a==='bk-make'){
    bkMode=(bkMode==='make')?null:'make'; bkText=bkBuild(); bkErr=''; bkPending=null; render();
  }else if(a==='bk-file'){
    try{
      var blob=new Blob([bkText],{type:'application/json'}), url=URL.createObjectURL(blob), an=document.createElement('a');
      an.href=url; an.download=bkName(); document.body.appendChild(an); an.click(); an.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},3000);
      bkStamp(); render(); toast('백업 파일을 저장했어요');
    }catch(e){ toast('파일 저장이 안 돼요. 글자로 복사를 써 주세요'); }
  }else if(a==='bk-share'){
    try{
      var f=new File([bkText],bkName(),{type:'application/json'});
      navigator.share({files:[f],title:'몸짱소울 백업'}).then(function(){bkStamp(); render();}).catch(function(){});
    }catch(e){ toast('공유가 안 돼요. 다른 방법을 써 주세요'); }
  }else if(a==='bk-copy'){
    try{
      navigator.clipboard.writeText(bkText).then(function(){bkStamp(); render(); toast('복사했어요');},bkCopyFallback);
    }catch(e){ bkCopyFallback(); }
  }else if(a==='bk-restore'){

function reduceMotion(){

}
var AC=null;
function tone(freq,start,len,vol){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    if(!AC) AC=new C();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='triangle'; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    var t=AC.currentTime+start; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.start(t); o.stop(t+len+0.02);
  }catch(e){}
}

  var cols=['#F6C445','#46E0A5','#FF6A5B','#5CC8FF','#FFFFFF'];

    ps.push({x:W/2+(Math.random()-.5)*80,y:H*0.42,vx:(Math.random()-.5)*9,vy:-Math.random()*10-3,
             s:4+Math.random()*5,c:cols[i%5],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  }

      p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); cx.restore();

  "당신은 몸짱용사입니다. 각 모험지의 적들을 물리치며 '전신짱 마왕'을 토벌할 힘을 기르십시오.",

  "하루의 퀘스트 진행은 하단의 오늘의 모험 종료 버튼을 눌러 종료할 수 있습니다. 이 경우 오늘의 퀘스트 사항이 저장되고 기록되며 수정불가해지니 신중히 눌러주세요.",

  "1000XP 이상 획득하여 마왕성에 도전한 경우, 마왕성 퀘스트를 모두 완료하면 마왕을 토벌할 수 있습니다. 하지만 퀘스트 실패 시 마왕에게 패배하게 됩니다.",
  "매주 일요일은 회복의 신전을 방문하게 됩니다. 몸짱신의 가호를 받으며 다음 토벌을 위한 회복을 진행하세요.",
  "몸짱용사가 되어 마왕을 무찌르고 몸짱왕국을 되살려보세요."
];
var introEl=document.getElementById('intro'), introImg=document.getElementById('introimg'), introTxt=document.getElementById('introtxt'),
    introDots=document.getElementById('introdots'), introPrev=document.getElementById('introprev'), introNext=document.getElementById('intronext'), iN=0;
function introRender(){
  introImg.innerHTML=introScene(iN);
  introTxt.textContent=INTRO_TXT[iN];

  introPrev.disabled=(iN===0);
  introNext.textContent=(iN===INTRO_TXT.length-1)?'모험 시작!':'다음';

function introClose(){ introEl.hidden=true; try{localStorage.setItem('home-training-intro','1');}catch(e){} }
introNext.addEventListener('click',function(){ if(iN>=INTRO_TXT.length-1){introClose();} else{iN++; introRender();} });
introPrev.addEventListener('click',function(){ if(iN>0){iN--; introRender();} });
document.getElementById('introskip').addEventListener('click',introClose);
var tx0=null;
introEl.addEventListener('touchstart',function(e){tx0=e.touches[0].clientX;},{passive:true});
introEl.addEventListener('touchend',function(e){
  if(tx0==null) return; var dx=e.changedTouches[0].clientX-tx0; tx0=null;
  if(dx<-50 && iN<INTRO_TXT.length-1){iN++; introRender();} else if(dx>50 && iN>0){iN--; introRender();}
},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if(!askEl.hidden) askEl.hidden=true; else if(!introEl.hidden) introClose(); }
});
var introSeen=false; try{introSeen=!!localStorage.getItem('home-training-intro');}catch(e){introSeen=false;}


/* ---------- 클라우드 동기화 (Firebase) ---------- */
var cqEl=document.getElementById('cq'), cqD=document.getElementById('cqd'), cqB=document.getElementById('cqb');
function withTimeout(p,ms){ return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'});},ms);})]); }
function isEmptyData(x){ return !x || (!Object.keys(x.log||{}).length && !(x.body||[]).length); }
function coreOf(x){ return {start:x.start,log:x.log,body:x.body}; }
function dayScore(L){ return Object.keys(L.done||{}).length+Object.keys(L.diet||{}).length+(L.km>0?1:0)+(L.out?1:0); }
function mergeData(a,b){
  var log={}, keys={};
  Object.keys(a.log||{}).forEach(function(k){keys[k]=1;}); Object.keys(b.log||{}).forEach(function(k){keys[k]=1;});
  Object.keys(keys).forEach(function(k){
    var x=(a.log||{})[k], y=(b.log||{})[k];
    if(x&&!y){ log[k]=x; } else if(y&&!x){ log[k]=y; }
    else{
      var pick; if(x.ended&&!y.ended) pick=x; else if(y.ended&&!x.ended) pick=y; else pick=(dayScore(x)>=dayScore(y))?x:y;
      var c=JSON.parse(JSON.stringify(pick)); if(x.cleared||y.cleared) c.cleared=true; log[k]=c;
    }
  });
  var seen={}, body=[];
  (a.body||[]).concat(b.body||[]).forEach(function(e){ if(e&&e.date&&!seen[e.date]){ seen[e.date]=1; body.push(e); } });
  body.sort(function(p,q){return p.date<q.date?-1:1;});
  var st=(a.start&&b.start)?(a.start<b.start?a.start:b.start):(a.start||b.start);
  return {start:st,log:log,body:body};
}
function applyData(x,dirty){
  noDirty=true;
  S={start:x.start,log:x.log,body:x.body,lastBackup:S.lastBackup,uid:S.uid,cloudTs:S.cloudTs,dirty:!!dirty};
  save(); noDirty=false;
}
function hm(){var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes());}
function setStat(t){ CL.stat=t; var el=document.getElementById('clstat'); if(el) el.textContent=t; }
function clMsg(t,err){ CL.msg=t; CL.err=!!err; var el=document.getElementById('clmsg'); if(el){ el.textContent=t; el.className='clmsg'+(err?' err':''); } }
function cloudOn(){ return !!(window.__fb && CL.ready); }
function cloudErr(e){
  var c=(e&&e.code)||'';
  var t=(c==='permission-denied')?'저장이 거절됐어요. 파이어베이스 규칙(4번)을 게시했는지 확인해 주세요.':
        (c==='timeout'||c==='unavailable')?'연결이 불안정해요. 잠시 뒤 다시 시도돼요.':('동기화 오류: '+(c||String(e)));
  setStat(t);
}
function cloudSchedule(){
  if(!CL.user) return;
  clearTimeout(CL.timer);
  CL.timer=setTimeout(function(){ cloudSync(); },1500);
}
async function pushNow(uid,base){
  var ts=Math.max(Date.now(),(base||0)+1,(S.cloudTs||0)+1);
  await withTimeout(window.__fb.set(uid,{v:1,updated:ts,data:JSON.stringify(coreOf(S)),email:(CL.user&&CL.user.email)||''}),15000);
  noDirty=true; S.cloudTs=ts; S.uid=uid; S.dirty=false; save(); noDirty=false;
}
async function cloudSync(){
  if(!cloudOn()||!CL.user) return;
  if(CL.busy){ CL.again=true; return; }
  if(!navigator.onLine){ setStat('오프라인이에요. 연결되면 자동으로 저장돼요.'); return; }
  CL.busy=true; CL.last=Date.now(); setStat('동기화 중…');
  try{
    var uid=CL.user.uid, r=await withTimeout(window.__fb.get(uid),15000), rdata=null, rts=0;
    if(r && r.data){ try{rdata=JSON.parse(r.data);}catch(e){rdata=null;} rts=r.updated||0; }
    var localHas=!isEmptyData(S);
    if(S.uid && S.uid!==uid && localHas){ CL.busy=false; cloudChoice(rdata,rts,uid); return; }
    if(S.uid!==uid){ noDirty=true; S.cloudTs=0; S.uid=uid; S.dirty=localHas; save(); noDirty=false; }
    var changed=false;
    if(rdata && rts>(S.cloudTs||0)){
      if(S.dirty && localHas){ applyData(mergeData(S,rdata),true); changed=true; toast('다른 기기 기록과 합쳤어요'); }
      else{ applyData(rdata,false); noDirty=true; S.cloudTs=rts; save(); noDirty=false; changed=true; if(!isEmptyData(rdata)) toast('클라우드 기록을 불러왔어요'); }
    }
    if(S.dirty || !rdata){ await pushNow(uid,rts); }
    setStat('동기화됨 · '+hm());
    if(changed) render();
  }catch(e){ cloudErr(e); }
  CL.busy=false;
  if(CL.again){ CL.again=false; cloudSchedule(); }
}
function cqClose(){ cqEl.hidden=true; }
function cloudChoice(rdata,rts,uid){
  cqB.innerHTML='';
  cqD.textContent='이 폰에는 다른 계정으로 저장한 기록이 있어요. 어떻게 할까요?';
  function btn(t,cls,fn){ var b=document.createElement('button'); b.type='button'; b.className=cls; b.textContent=t; b.addEventListener('click',function(){cqClose(); fn();}); cqB.appendChild(b); }
  btn('두 기록 합치기','primary',function(){ noDirty=true; S.uid=uid; S.cloudTs=0; S.dirty=true; save(); noDirty=false; cloudSync(); });
  btn('이 계정 기록으로 바꾸기 (이 폰 기록은 사라져요)','ghost big',function(){
    applyData(rdata||{start:fmt(TODAY),log:{},body:[]},false); noDirty=true; S.uid=uid; S.cloudTs=rts; save(); noDirty=false; sel=TODAY; render(); toast('이 계정의 기록으로 바꿨어요');
  });
  btn('취소하고 로그아웃','ghost big',function(){ window.__fb.signOut(); });
  cqEl.hidden=false;
}
function authMsg(e){
  var c=(e&&e.code)||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found') return '이메일이나 비밀번호가 맞지 않아요.';
  if(c==='auth/email-already-in-use') return '이미 가입된 이메일이에요. "로그인"을 눌러 주세요.';
  if(c==='auth/weak-password') return '비밀번호는 6자 이상이어야 해요.';
  if(c==='auth/invalid-email') return '이메일 주소 모양이 맞지 않아요.';
  if(c==='auth/network-request-failed') return '인터넷 연결을 확인해 주세요.';
  if(c==='auth/too-many-requests') return '시도가 너무 많아요. 잠시 뒤 다시 해 주세요.';
  if(c==='auth/operation-not-allowed') return '파이어베이스에서 이메일/비밀번호 로그인이 켜져 있는지 확인해 주세요.';
  return '오류: '+(c||String(e));
}
async function cloudAuth(signup,em,pw){
  if(!em||!pw){ clMsg('이메일과 비밀번호를 입력해 주세요.',true); return; }
  clMsg(signup?'가입하는 중…':'로그인하는 중…',false);
  try{ if(signup) await window.__fb.signUp(em,pw); else await window.__fb.signIn(em,pw); }
  catch(e){ clMsg(authMsg(e),true); }
}
function cloudAction(a){
  var em=((document.getElementById('cle')||{}).value||'').trim(), pw=(document.getElementById('clp')||{}).value||'';
  if(!cloudOn()) return;
  if(a==='cl-in'||a==='cl-up'){ cloudAuth(a==='cl-up',em,pw); }
  else if(a==='cl-out'){ window.__fb.signOut().then(function(){ toast('로그아웃했어요. 이 폰의 기록은 그대로 남아 있어요'); }); }
  else if(a==='cl-sync'){ cloudSync(); }
  else if(a==='cl-reset'){
    if(!em){ clMsg('위 이메일 칸에 가입한 이메일을 적어 주세요.',true); return; }
    window.__fb.reset(em).then(function(){ clMsg('비밀번호 재설정 메일을 보냈어요. 메일함을 확인해 주세요.',false); }).catch(function(e){ clMsg(authMsg(e),true); });
  }
}
function cloudHtml(){
  var h='<h2>클라우드 동기화</h2><div class="card" style="padding:12px 16px 16px">';
  if(CL.fail && !CL.ready){
    return h+'<p class="clnote">로그인하면 기록이 구글 서버에 저장돼서, 폰을 바꿔도 다른 기기에서도 볼 수 있어요.</p><p class="clmsg err">이 화면에서는 클라우드를 쓸 수 없어요. GitHub 등으로 올린 앱 주소에서 사용해 주세요.</p></div>';
  }
  if(!CL.ready){
    return h+'<p class="clnote">클라우드에 연결하는 중이에요…</p></div>';
  }
  if(CL.user){
    return h+'<p class="cluser">로그인됨 · <b>'+String(CL.user.email||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</b></p>'+
      '<p class="clnote" id="clstat">'+(CL.stat||'')+'</p>'+
      '<div class="bkrow"><button type="button" class="primary" data-a="cl-sync">지금 동기화</button><button type="button" class="ghost big" data-a="cl-out">로그아웃</button></div></div>';
  }
  return h+'<p class="clnote">로그인하면 기록이 구글 서버에 저장돼서, 폰을 바꿔도 다른 기기에서도 볼 수 있어요.</p>'+
    '<div class="field"><label>이메일<input id="cle" type="email" inputmode="email" autocomplete="email" autocapitalize="off"></label></div>'+
    '<div class="field"><label>비밀번호 (6자 이상)<input id="clp" type="password" autocomplete="current-password"></label></div>'+
    '<div class="bkrow"><button type="button" class="primary" data-a="cl-in">로그인</button><button type="button" class="ghost big" data-a="cl-up">회원가입</button></div>'+
    '<div style="margin-top:6px"><button type="button" class="del" data-a="cl-reset">비밀번호를 잊었어요</button></div>'+
    '<p class="clmsg'+(CL.err?' err':'')+'" id="clmsg">'+(CL.msg||'')+'</p></div>';
}
function refreshCloudUI(){
  if(tab!=='log') return;
  var ae=document.activeElement; if(ae && (ae.id==='cle'||ae.id==='clp')) return;
  render();
}
function cloudInit(){
  if(CL.ready || !window.__fb) return;
  CL.ready=true; CL.fail=false;
  window.__fb.onAuth(function(u){ CL.user=u||null; if(u){ cloudSync(); } refreshCloudUI(); });
}
window.addEventListener('fb-ready',cloudInit);
window.addEventListener('fb-fail',function(){ if(!window.__fb){ CL.fail=true; refreshCloudUI(); } });
document.addEventListener('visibilitychange',function(){ if(!document.hidden && CL.user && Date.now()-(CL.last||0)>20000){ cloudSync(); } });
window.addEventListener('online',function(){ if(CL.user) cloudSync(); });
if(window.__fb) cloudInit(); else if(window.__fbErr) CL.fail=true;

render();
if(!introSeen) introOpen();
})();
</script>

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
