<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>몸짱소울</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C1716">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몸짱소울">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1716; --surface:#14262A; --soft:#1B3236; --edge:#070E0D; --line:#2B4a4E;
  --ink:#EAF5F1; --muted:#8FAEAA; --gold:#F6C445; --gold-ink:#2B2000; --link:#F6C445;
  --clear:#46E0A5; --clear-ink:#04241A; --boss:#FF6A5B; --boss-ink:#2B0A06;
  --accent:var(--gold); --accent-ink:var(--gold-ink); --marker:var(--gold);
  --disp:'Do Hyeon','Noto Sans KR',system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E8F1EE; --surface:#FFFFFF; --soft:#E2EEEA; --edge:#B7CBC4; --line:#C8DBD4;
    --ink:#10231F; --muted:#4D6964; --gold:#F1B90F; --gold-ink:#2B2000; --link:#8A5A00;
    --clear:#1FBF86; --clear-ink:#032117; --boss:#DC3E31; --boss-ink:#FFFFFF;
  }
}
:root[data-theme="light"]{
  --bg:#E8F1EE; --surface:#FFFFFF; --soft:#E2EEEA; --edge:#B7CBC4; --line:#C8DBD4;
  --ink:#10231F; --muted:#4D6964; --gold:#F1B90F; --gold-ink:#2B2000; --link:#8A5A00;
  --clear:#1FBF86; --clear-ink:#032117; --boss:#DC3E31; --boss-ink:#FFFFFF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;}
button{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent;}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
.wrap{max-width:560px; margin:0 auto; padding:18px 16px 170px;}
.eyebrow{color:var(--muted); font-size:14px; margin:0 2px 8px; font-weight:500;}
h1{font-family:var(--disp); font-weight:400; font-size:36px; line-height:1.15; margin:0;}
h1.ph{margin:22px 2px 6px;}
h2{font-family:var(--disp); font-weight:400; font-size:19px; margin:26px 2px 10px; padding-left:10px; border-left:4px solid var(--gold); line-height:1.2;}
h2 .cnt{color:var(--muted); font-size:15px; margin-left:6px;}
h3{margin:0;}

/* HUD */
.hud{display:flex; gap:14px; align-items:center; background:var(--surface); border:2px solid var(--line); border-radius:20px; padding:12px 14px; box-shadow:0 4px 0 var(--edge); margin:0 0 16px;}
.lv{flex:none; width:64px; height:70px; background:var(--gold); color:var(--gold-ink); display:grid; place-content:center; text-align:center;
  clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%); font-family:var(--disp); line-height:1;}
.lv span{font-size:12px;} .lv b{font-size:30px; font-weight:400;}
.hud-main{flex:1; min-width:0;}
.hud-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.ttl{font-family:var(--disp); font-size:19px;}
.stk{font-size:13px; color:var(--muted); white-space:nowrap;}
.stk b{font-family:var(--disp); font-size:19px; color:var(--link); font-weight:400;}
.xpbar{height:12px; border-radius:6px; background:var(--soft); overflow:hidden; margin:6px 0 4px; border:1px solid var(--line);}
.xpbar i{display:block; height:100%; background:var(--gold); border-radius:6px; transition:width .4s ease;}
.xpbar.big{height:16px; margin:14px 0 6px;}
.xpt{display:flex; justify-content:space-between; font-size:12px; color:var(--muted);}

/* quest banner */
.quest{position:relative; background:var(--surface); border:2px solid var(--gold); border-radius:24px; padding:18px 18px 16px; box-shadow:0 5px 0 var(--edge); overflow:hidden;}
.quest.boss{border-color:var(--boss);}
.quest.cleared{border-color:var(--clear);}
.qk{font-size:13px; font-weight:700; color:var(--link); margin:0 0 2px;}
.quest.boss .qk{color:var(--boss);}
.quest.cleared .qk{color:var(--clear);}
.qs{font-size:14px; color:var(--muted); margin:6px 0 14px;}
.qs b{color:var(--ink);}
.segs{display:flex; gap:4px;}
.segs i{flex:1; height:14px; border-radius:4px; background:var(--soft); border:1px solid var(--line);}
.segs i.on{background:var(--clear); border-color:var(--clear);}
.qm{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; font-size:13px; color:var(--muted);}
.qm b{font-family:var(--disp); font-size:24px; font-weight:400; color:var(--ink);}
.stamp{position:absolute; top:16px; right:16px; transform:rotate(8deg); border:3px solid var(--clear); color:var(--clear);
  font-family:var(--disp); font-size:22px; padding:0 10px; border-radius:8px; letter-spacing:.05em; line-height:1.3;}

/* quest cards */
.q{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:4px 16px; box-shadow:0 4px 0 var(--edge); margin:0 0 14px;}
.q.ok{border-color:var(--clear);}
.row{display:flex; align-items:center; gap:14px; width:100%; min-height:62px; padding:10px 0; background:none; border:0; text-align:left;}
.row + .row{border-top:1px solid var(--line);}
.box{flex:none; width:30px; height:30px; border-radius:10px; border:2px solid var(--line); display:grid; place-items:center; color:transparent; font-weight:900; font-size:16px;}
.row[aria-pressed="true"] .box{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.row[aria-pressed="true"] .rt{color:var(--muted);}
.row[disabled]{opacity:.55; cursor:default;}
.rt{font-weight:700; flex:1; min-width:0;}
.rs{display:block; font-size:13px; color:var(--muted); font-weight:400;}
.rew{flex:none; margin-left:auto; font-family:var(--disp); font-size:14px; padding:1px 10px; border-radius:999px; background:var(--gold); color:var(--gold-ink); line-height:22px; white-space:nowrap;}
.rew.ok{background:var(--clear); color:var(--clear-ink);}
.ex{padding:16px;}
.ex-head{display:flex; align-items:center; gap:12px;}
.idx{flex:none; width:30px; height:30px; border-radius:10px; background:var(--soft); color:var(--link); font-family:var(--disp); font-size:18px; display:grid; place-items:center; line-height:1;}
.ex-name{font-family:var(--disp); font-weight:400; font-size:21px; flex:1; min-width:0; word-break:keep-all; line-height:1.25;}
.desc{margin:8px 0 0; font-size:14px; color:var(--muted);}
.dose{margin:8px 0 0; font-size:14px; color:var(--muted);}
.dose b{font-family:var(--disp); font-size:19px; color:var(--link); font-weight:400;}
.sets{display:flex; gap:10px; margin:14px 0 4px; flex-wrap:wrap;}
.set{min-width:64px; height:54px; border-radius:16px; border:2px solid var(--line); background:var(--soft); font-family:var(--disp); font-size:24px; line-height:1; box-shadow:0 3px 0 var(--edge);}
.set.wide{min-width:110px; font-size:20px;}
.set[aria-pressed="true"]{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.pop{animation:pop .3s ease-out;}
@keyframes pop{0%{transform:scale(.82);}60%{transform:scale(1.14);}100%{transform:scale(1);}}
.tipbtn{background:none; border:0; padding:8px 0 4px; color:var(--link); font-weight:700; font-size:14px; min-height:44px;}
.tips{margin:0 0 6px; padding:12px 16px 12px 32px; background:var(--soft); border-radius:14px; font-size:14px;}
.tips li{margin:2px 0;}
.var{margin:8px 0 0; font-size:13px; color:var(--muted); padding-left:0; list-style:none;}
.push{color:var(--ink); font-weight:700;}
.note{font-size:13px; color:var(--muted); margin:2px 4px 0;}
.figs{display:flex; gap:8px; margin:10px 0 4px;}
svg.fig{width:100%; height:auto; display:block; background:var(--soft); border-radius:14px;}
.vid{display:inline-block; margin:2px 0 4px; color:var(--link); font-weight:700; font-size:14px; min-height:44px; line-height:44px;}
.fcap{font-size:12px; color:var(--muted); text-align:center; margin:2px 0 0;}
.card{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:4px 16px; box-shadow:0 4px 0 var(--edge);}

/* map (week) */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0 6px;}
.stat{background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:14px 16px; box-shadow:0 4px 0 var(--edge);}
.stat b{display:block; font-family:var(--disp); font-weight:400; font-size:38px; color:var(--link); line-height:1.1;}
.stat span{font-size:13px; color:var(--muted);}
.map{position:relative; margin-top:14px;}
.map::before{content:""; position:absolute; left:27px; top:28px; bottom:28px; width:4px; background:var(--line); border-radius:2px;}
.node-row{position:relative; display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:none; border:0; padding:8px 0; min-height:64px;}
.node{flex:none; width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--soft); border:3px solid var(--line); font-family:var(--disp); font-size:22px; z-index:1;}
.node-row.clr .node{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.node-row.now .node{border-color:var(--gold); box-shadow:0 0 0 4px var(--surface), 0 0 0 7px var(--gold);}
.node-row.boss .node{border-color:var(--boss);}
.node-row.boss:not(.clr) .node{color:var(--boss);}
.info{flex:1; min-width:0; background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:10px 14px; display:block;}
.node-row.now .info{border-color:var(--gold);}
.info b{font-family:var(--disp); font-weight:400; font-size:19px; display:block; line-height:1.25;}
.info small{display:block; color:var(--muted); font-size:13px;}
.dpct{font-family:var(--disp); font-size:17px; min-width:52px; text-align:right;}
.node-row.clr .dpct{color:var(--clear);}
.mini{display:block; height:6px; border-radius:3px; background:var(--soft); margin-top:8px; overflow:hidden;}
.mini i{display:block; height:100%; background:var(--clear); border-radius:3px;}

/* achievements */
.achs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.ach{background:var(--surface); border:2px solid var(--gold); border-radius:16px; padding:12px; box-shadow:0 3px 0 var(--edge);}
.ach.lock{border-color:var(--line); opacity:.62;}
.ai{width:36px; height:36px; border-radius:50%; background:var(--gold); color:var(--gold-ink); display:grid; place-items:center; font-family:var(--disp); font-size:19px; margin-bottom:6px;}
.ach.lock .ai{background:var(--soft); color:var(--muted);}
.ach b{display:block; font-family:var(--disp); font-weight:400; font-size:17px; line-height:1.25;}
.ach small{display:block; font-size:12px; color:var(--muted); line-height:1.4; margin-top:2px;}

/* record */
.field{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
.field label{flex:1 1 90px; font-size:13px; color:var(--muted);}
.field input{display:block; width:100%; margin-top:4px; height:50px; border-radius:14px; border:2px solid var(--line); background:var(--soft); color:var(--ink); padding:0 12px; font:inherit;}
.primary{width:100%; min-height:54px; border-radius:16px; border:0; background:var(--gold); color:var(--gold-ink); font-family:var(--disp); font-size:19px; margin-top:6px; box-shadow:0 4px 0 var(--edge);}
.ghost{min-height:44px; border-radius:14px; border:2px solid var(--line); background:none; padding:0 16px; font-weight:500;}
.ghost.warn{border-color:var(--boss); color:var(--boss);}
.chart-title{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; padding:12px 0 0;}
.chart-title b{font-weight:700;}
.chart-title span{font-family:var(--disp); font-size:22px; color:var(--link);}
svg.chart{width:100%; height:auto; display:block;}
.empty{color:var(--muted); font-size:14px; margin:10px 0;}
.hist{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; font-size:14px;}
.hist + .hist{border-top:1px solid var(--line);}
.del{background:none; border:0; color:var(--muted); min-height:44px; padding:0 8px; text-decoration:underline;}

/* timer, toast, nav, overlay */
.timer{position:fixed; left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:536px;
  bottom:calc(88px + env(safe-area-inset-bottom,0px)); background:var(--surface); border:2px solid var(--gold); color:var(--ink);
  border-radius:18px; padding:10px 14px; display:flex; align-items:center; gap:12px; z-index:20; box-shadow:0 4px 0 var(--edge);}
.timer[hidden]{display:none;}
.tlab{font-size:13px; color:var(--muted); font-weight:700;}
.timer .tnum{font-family:var(--disp); font-size:38px; min-width:52px; line-height:1; color:var(--link); font-variant-numeric:tabular-nums;}
.timer .tbar{flex:1; height:10px; border-radius:5px; background:var(--soft); overflow:hidden;}
.timer .tbar i{display:block; height:100%; background:var(--gold); width:0; transition:width .25s linear; border-radius:5px;}
.timer button{min-height:44px; border-radius:14px; border:2px solid var(--line); background:none; padding:0 14px; font-weight:700;}
.toast{position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + env(safe-area-inset-top,0px)); z-index:60;
  background:var(--gold); color:var(--gold-ink); font-family:var(--disp); font-size:19px; padding:6px 18px; border-radius:999px; box-shadow:0 4px 0 var(--edge); max-width:calc(100% - 24px); text-align:center;}
.toast[hidden]{display:none;}
.toast.show{animation:tin .25s ease-out;}
@keyframes tin{from{transform:translate(-50%,-14px); opacity:0;}to{transform:translate(-50%,0); opacity:1;}}
.nav{position:fixed; left:50%; transform:translateX(-50%); width:calc(100% - 24px); max-width:536px;
  bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:6px; padding:6px;
  background:var(--surface); border:2px solid var(--line); border-radius:22px; box-shadow:0 4px 0 var(--edge); z-index:30;}
.nav button{flex:1; min-height:52px; border:0; border-radius:16px; background:none; font-family:var(--disp); font-size:19px; color:var(--muted);}
.nav button[aria-current="page"]{background:var(--gold); color:var(--gold-ink);}
.ov{position:fixed; inset:0; z-index:50; background:rgba(3,10,9,.8); display:grid; place-items:center; padding:20px;}
.ov[hidden]{display:none;}
#cf{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.ovc{position:relative; width:100%; max-width:380px; background:var(--surface); border:3px solid var(--gold); border-radius:28px; padding:26px 22px 22px; text-align:center; box-shadow:0 8px 0 var(--edge); animation:drop .3s ease-out;}
@keyframes drop{from{transform:translateY(24px) scale(.9); opacity:0;}to{transform:none; opacity:1;}}
.ovk{font-family:var(--disp); letter-spacing:.1em; color:var(--link); font-size:18px; margin:0;}
.ovh{font-family:var(--disp); font-weight:400; font-size:34px; margin:4px 0 8px; padding:0; border:0; line-height:1.2;}
.lab{margin:6px 0 0; font-size:13px; color:var(--muted);}
.bigxp{font-family:var(--disp); font-size:60px; color:var(--link); line-height:1.1; margin:0;}
.lvup{margin:8px 0 0; font-size:16px;} .lvup b{font-family:var(--disp); font-weight:400; font-size:22px; color:var(--link);}
.achl{margin:8px 0 0; display:inline-block; background:var(--soft); border-radius:999px; padding:2px 14px; font-size:14px; font-weight:700;}
.xpt2{margin:0 0 16px; font-size:13px; color:var(--muted);}
@media (prefers-reduced-motion: reduce){
  .xpbar i,.timer .tbar i,.pop,.ovc,.toast.show{transition:none; animation:none;}
}

/* 보스전 */
.bonustag{flex:none; font-family:var(--disp); font-size:13px; padding:0 8px; border-radius:999px; border:2px solid var(--gold); color:var(--link); line-height:20px; white-space:nowrap;}
.bossrule{margin-top:14px; border-top:2px dashed var(--line); padding-top:12px;}
.pips{display:flex; gap:6px;}
.pip{flex:1; text-align:center; font-family:var(--disp); font-size:16px; padding:4px 0; border-radius:10px; background:var(--soft); border:2px solid var(--line); color:var(--muted);}
.pip.on{background:var(--clear); border-color:var(--clear); color:var(--clear-ink);}
.bossrule p{font-size:12px; color:var(--muted); margin:8px 0 10px;}
.stamp.r-draw{border-color:var(--gold); color:var(--link);}
.stamp.r-lose{border-color:var(--boss); color:var(--boss);}
.quest.cleared.r-draw{border-color:var(--gold);}
.quest.cleared.r-lose{border-color:var(--boss);}
.node-row.draw .node{background:var(--gold); border-color:var(--gold); color:var(--gold-ink);}
.node-row.lose .node{background:var(--boss); border-color:var(--boss); color:#fff;}
.node-row.draw .dpct{color:var(--link);}
.node-row.lose .dpct{color:var(--boss);}
.ovc[data-mode="draw"]{border-color:var(--muted);}
.ovc[data-mode="lose"]{border-color:var(--boss);}
.ovc[data-mode="lose"] .ovk{color:var(--boss);}
.ovc[data-mode="draw"] .ovk{color:var(--muted);}
.scene{width:100%; height:auto; display:block; margin:8px 0 10px; border-radius:22px;}
.bnote{font-size:14px; margin:0 0 6px;}
.a-bob{animation:bob .7s ease-in-out infinite alternate;}
@keyframes bob{to{transform:translateY(-9px);}}
.a-spin{animation:spinx 3.2s linear infinite; transform-box:fill-box; transform-origin:center;}
@keyframes spinx{to{transform:rotate(360deg);}}
.a-twk{animation:twk 1.2s ease-in-out infinite alternate;}
@keyframes twk{from{opacity:1;}to{opacity:.3;}}
.a-fall{animation:fall .6s ease-in both;}
@keyframes fall{from{transform:rotate(-30deg) translateY(-14px);}to{transform:none;}}
.a-back{animation:backl .9s ease-out both;}
@keyframes backl{from{transform:translateX(26px);}to{transform:none;}}
.a-back2{animation:backr .9s ease-out both;}
@keyframes backr{from{transform:translateX(-26px);}to{transform:none;}}
@media (prefers-reduced-motion: reduce){
  .a-bob,.a-spin,.a-twk,.a-fall,.a-back,.a-back2{animation:none;}
}

/* 모험 지도 */
.gmap{position:relative; width:100%; aspect-ratio:360/1370; border-radius:26px; border:2px solid var(--line); box-shadow:0 4px 0 var(--edge); overflow:hidden; margin:16px 0 8px; background:#BFE3B4;}
.mapsvg{position:absolute; inset:0; width:100%; height:100%; display:block;}
.stg{position:absolute; background:none; border:0; padding:0; border-radius:18px; cursor:pointer;}
.stg:focus-visible{outline:3px solid var(--gold); outline-offset:-3px;}
.plate{position:absolute; left:50%; bottom:0; transform:translateX(-50%); background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:2px 10px 3px; text-align:center; white-space:nowrap; box-shadow:0 3px 0 var(--edge);}
.plate b{display:block; font-family:var(--disp); font-weight:400; font-size:15px; line-height:1.3; color:var(--ink);}
.plate small{display:block; font-size:11px; color:var(--muted); line-height:1.3;}
.stg.boss .plate{border-color:var(--boss);}
.stg.clr .plate{border-color:var(--clear);}
.stg.draw .plate{border-color:var(--gold);}
.stg.lose .plate{border-color:var(--boss);}
.stg.now .plate{background:var(--gold); border-color:var(--gold);}
.stg.now .plate b,.stg.now .plate small{color:var(--gold-ink);}

/* 퀘스트 배너 장소 그림 */
.qtop{display:flex; align-items:center; gap:10px;}
.qtext{flex:1; min-width:0;}
.qimg{flex:none; width:112px; height:96px; display:block;}
.quest h1{font-size:32px; word-break:keep-all;}
.stamp{position:static; display:inline-block; margin-left:10px; transform:rotate(-5deg); font-size:16px; padding:0 8px; border-width:2px; border-radius:6px; vertical-align:middle; line-height:1.4;}

/* 거리 입력 · 전날/다음날 */
.kmrow{display:flex; align-items:center; gap:10px; padding:10px 0 14px; border-top:1px solid var(--line);}
.kmrow label{flex:1; font-size:14px; color:var(--muted);}
.kmrow input{width:100px; height:48px; border-radius:12px; border:2px solid var(--line); background:var(--soft); color:var(--ink); font-family:var(--disp); font-size:22px; text-align:center; padding:0 8px;}
.kmrow span{font-family:var(--disp); font-size:18px; color:var(--link);}
.stat b em{font-style:normal; font-size:16px; color:var(--hero-muted,var(--muted)); margin-left:3px;}
.kmv{font-family:var(--disp); font-weight:400; font-size:20px; color:var(--link);}
.daynav{display:flex; gap:10px; margin:24px 0 4px; align-items:stretch;}
.dn{flex:1; min-width:0; min-height:66px; border-radius:16px; border:2px solid var(--line); background:var(--surface); box-shadow:0 3px 0 var(--edge); font-family:var(--disp); font-size:19px; line-height:1.25; padding:8px 10px; text-align:center;}
.dn small{display:block; font-family:'Noto Sans KR',system-ui,sans-serif; font-size:12px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.dn.today{flex:0 0 auto; padding:0 16px; background:var(--gold); color:var(--gold-ink); border-color:var(--gold);}
.toast{width:max-content; white-space:nowrap;}

/* 잠금 · 모험 종료 · 시작 안내 */
.row[disabled]{opacity:.55; cursor:default;}
.set[disabled]{opacity:.55; cursor:default;}
.kmrow input:disabled{opacity:.6;}
.rew.none{background:var(--soft); color:var(--muted); border:1px solid var(--line); line-height:20px;}
.endbtn{width:100%; min-height:60px; margin:22px 0 0; border-radius:16px; border:2px solid var(--boss); background:var(--surface); color:var(--boss); font-family:var(--disp); font-size:20px; box-shadow:0 4px 0 var(--edge);}
.endedbar{margin:22px 0 0; padding:14px 16px; border-radius:16px; border:2px dashed var(--line); text-align:center;}
.endedbar b{display:block; font-family:var(--disp); font-weight:400; font-size:19px;}
.endedbar span{font-size:13px; color:var(--muted);}
.askbtns{display:flex; gap:10px; margin-top:14px;}
.askbtns>button{flex:1; margin-top:0;}
.ghost.big{min-height:54px; border-radius:16px; font-family:var(--disp); font-size:19px;}
.ovc{max-height:calc(100dvh - 40px); overflow:auto;}
.introtxt{font-size:16px; line-height:1.65; margin:8px 2px 10px; min-height:112px; text-align:center; word-break:keep-all;}
.dots{display:flex; gap:6px; justify-content:center; margin:6px 0 2px;}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--line);}
.dots i.on{background:var(--gold); width:22px; border-radius:4px;}
.skip{background:none; border:0; color:var(--muted); min-height:44px; margin-top:6px; width:100%; font-size:14px;}
.quest .qs{margin-bottom:0;}
.qimg{display:block; width:100%; height:auto; margin:12px 0 14px; background:var(--soft); border-radius:16px;}
.ai.bimg{width:auto; height:48px; background:none; border-radius:0; display:block; margin-bottom:4px;}
.ai.bimg svg{height:48px; width:auto; display:block;}
.ach.lock .ai.bimg{background:none;}
.sil{filter:brightness(0) opacity(.32);}
.bk-btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.bk-btns .ghost{flex:1; min-width:104px;}
.bk-btns .primary{flex:1;}
.bk-ta{width:100%; min-height:96px; margin-top:10px; border-radius:12px; border:2px solid var(--line); background:var(--soft); color:var(--ink); font:12px/1.4 ui-monospace,Menlo,monospace; padding:8px; resize:vertical;}
.bk-file{display:block; width:100%; margin-top:8px; font-size:14px; color:var(--muted);}
.bk-sum{margin-top:12px; padding:12px 14px; border-radius:14px; background:var(--soft); border:2px solid var(--gold);}
.bk-sum b{display:block; font-family:var(--disp); font-weight:400; font-size:18px;}
.bk-sum span{font-size:13px; color:var(--muted);}
.bk-err{margin:10px 0 0; color:var(--boss); font-size:14px; font-weight:700;}
.quest.res.r-win{border-color:var(--clear);}
.quest.res.r-lose{border-color:var(--boss);}
.quest.res.r-bless{border-color:var(--gold);}
.stamp.r-bless{border-color:var(--gold); color:var(--link);}
.stamp.r-win{border-color:var(--clear); color:var(--clear);}

/* 클라우드 동기화 */
.bkrow{display:flex; gap:10px;}
.bkrow>button{flex:1; margin-top:0;}
.bkbtns{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.bkbtns>button{flex:1 1 30%; margin-top:0; min-height:50px;}
.clnote{font-size:13px; color:var(--muted); margin:2px 0 10px;}
.clmsg{font-size:13px; margin:10px 2px 0; color:var(--muted); min-height:20px;}
.clmsg.err{color:var(--boss); font-weight:700;}
.cluser{font-size:14px; margin:0 0 4px;}
.cluser b{font-family:var(--disp); font-weight:400; font-size:17px;}

/* 중간보스 이름 · 단계형 업적 */
.qtitle{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:2px 0 0;}
.qtitle h1{margin:0;}
.bchip{font-family:var(--disp); font-size:15px; padding:2px 12px; border-radius:999px; background:var(--soft); border:2px solid var(--boss); color:var(--boss); line-height:1.5; white-space:nowrap;}
.bchip.god{border-color:var(--gold); color:var(--link);}
.tiers{display:flex; gap:4px; margin-top:8px;}
.tiers i{flex:1; height:6px; border-radius:3px; background:var(--soft); border:1px solid var(--line);}
.tiers i.on{background:var(--gold); border-color:var(--gold);}
.pbar{display:block; height:6px; border-radius:3px; background:var(--soft); margin-top:6px; overflow:hidden;}
.pbar i{display:block; height:100%; background:var(--clear); border-radius:3px;}
.ach.max{border-color:var(--clear);}

/* 스톱워치 */
.swbtn{min-height:50px; border-radius:14px; border:2px solid var(--gold); background:var(--soft); color:var(--link); font-family:var(--disp); font-size:18px; padding:0 20px; margin-top:12px; box-shadow:0 3px 0 var(--edge);}

/* 몸짱 여관 · 전리품 */
.stage{display:flex; gap:14px; align-items:center; background:var(--surface); border:2px solid var(--gold); border-radius:24px; padding:14px; box-shadow:0 5px 0 var(--edge); margin:0 0 6px;}
.stage-pv{flex:none; width:150px; background:var(--soft); border-radius:18px;}
.hpv{width:100%; height:auto; display:block;}
.stage-info{flex:1; min-width:0;}
.stage-n{font-family:var(--disp); font-size:28px; margin:0; line-height:1.2;}
.stage-t{margin:2px 0 8px; color:var(--link); font-size:15px; font-weight:700;}
.stage-w{font-size:13px; color:var(--muted); margin:0; word-break:keep-all;}
.chest{display:flex; gap:14px; align-items:center; padding:12px 16px;}
.chest-svg{flex:none; width:96px;}
.chest-svg svg{width:100%; height:auto; display:block;}
.chest-info{flex:1; min-width:0;}
.chest-n{margin:0 0 2px; font-size:15px;}
.chest-n b{font-family:var(--disp); font-weight:400; font-size:24px; color:var(--link);}
.primary[disabled]{opacity:.5; cursor:default;}
.slots{display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 12px;}
.slotbtn{min-height:42px; padding:0 14px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-family:var(--disp); font-size:16px;}
.slotbtn.on{background:var(--gold); border-color:var(--gold); color:var(--gold-ink);}
.items{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.item{display:block; text-align:center; padding:10px; border-radius:16px; border:2px solid var(--line); background:var(--surface); box-shadow:0 3px 0 var(--edge);}
.item.r-r{border-color:#5CC8FF;}
.item.r-l{border-color:var(--gold);}
.item.worn{background:var(--soft); outline:3px solid var(--clear); outline-offset:1px;}
.item[disabled]{cursor:default;}
.ii{display:block; height:76px; margin-bottom:4px;}
.ii svg{height:100%; width:auto; max-width:100%;}
.item b{display:block; font-family:var(--disp); font-weight:400; font-size:17px; line-height:1.25;}
.item small{display:block; color:var(--muted); font-size:12px; line-height:1.4;}
.item.lock .ii svg{filter:brightness(0) opacity(.3);}
.lootbox svg{height:96px; width:auto; display:block; margin:0 auto 4px;}
.lootcard{border:3px solid var(--line); border-radius:20px; padding:10px 12px; margin:8px 0; background:var(--soft);}
.lootcard.r-r{border-color:#5CC8FF;}
.lootcard.r-l{border-color:var(--gold);}
.lootimg svg{height:84px; width:auto; display:block; margin:0 auto;}
.lootn{font-family:var(--disp); font-size:26px; margin:4px 0 0; line-height:1.2;}
.lootr{margin:0; font-size:13px; color:var(--muted);}
.lootpv{width:150px; margin:0 auto 10px; background:var(--soft); border-radius:16px;}
.comfort{font-family:var(--disp); font-size:19px; line-height:1.5; margin:10px 4px 4px;}
.nav button{font-size:17px;}
.nav{gap:4px;}
.nav button{font-size:16px; min-width:0; padding:0 2px;}

/* 앱 버전 */
.ver{margin:0 0 10px; font-size:15px;}
.ver .vnum{font-family:var(--disp); font-size:22px; color:var(--link);}
.ver small{color:var(--muted);}
.chg{margin:12px 0 0; padding:0 0 0 18px; font-size:14px; color:var(--muted);}
.chg li{margin:5px 0;}
.chg b{font-family:var(--disp); font-weight:400; color:var(--link);}

.divider{height:0; margin:6px 0;}

/* 시작화면 */
#title{--lift:clamp(0px,calc((100vh - 640px) * .45),140px); position:fixed; inset:0; z-index:90; overflow:hidden; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  background:linear-gradient(var(--sk1),var(--sk2) 70%); color:#fff;}
#title[hidden]{display:none;}
#title:focus-visible{outline:none;}
#title.p-sunset{background:linear-gradient(var(--sk1),var(--sk3) 45%,var(--sk2) 72%);}
.ts-l{position:absolute; left:0; background-repeat:repeat-x; will-change:transform;}
.ts-cl{bottom:calc(330px + var(--lift)); height:150px; width:calc(100% + 560px); background-size:560px 150px; animation:tsS1 90s linear infinite;}
.ts-mt{bottom:calc(150px + var(--lift)); height:210px; width:calc(100% + 640px); background-size:640px 210px; animation:tsS2 70s linear infinite;}
.ts-hl{bottom:calc(96px + var(--lift)); height:150px; width:calc(100% + 420px); background-size:420px 150px; animation:tsS3 26s linear infinite;}
.ts-rd{bottom:0; height:calc(120px + var(--lift)); width:calc(100% + 300px); background-size:300px 120px; background-position:0 0; background-color:#E7C38A; animation:tsS4 6s linear infinite;}
@keyframes tsS1{to{transform:translate3d(-560px,0,0);}}
@keyframes tsS2{to{transform:translate3d(-640px,0,0);}}
@keyframes tsS3{to{transform:translate3d(-420px,0,0);}}
@keyframes tsS4{to{transform:translate3d(-300px,0,0);}}
.ts-mt,.ts-hl,.ts-bd,.ts-rd,.ts-dest{filter:var(--tsf,none);}
.ts-bd{bottom:calc(112px + var(--lift)); height:150px; width:calc(100% + 900px); background-size:900px 150px; animation:tsS7 30s linear infinite;}
@keyframes tsS7{to{transform:translate3d(-900px,0,0);}}
.ts-orb{position:absolute; border-radius:50%;}
.ts-stars{position:absolute; inset:0 0 40% 0; width:100%; height:60%;}
.ts-dest{position:absolute; right:3%; bottom:calc(196px + var(--lift)); width:160px; text-align:center;}
.ts-dest svg{display:block; width:100%; height:auto;}
.ts-plate{display:inline-block; margin-bottom:4px; background:#FFFFFF; color:#2B2138; border:2px solid #2B2138; border-radius:12px; padding:1px 10px 3px; box-shadow:0 3px 0 #2B2138; line-height:1.25;}
.ts-plate small{display:block; font-size:11px; color:#6B5F7A;}
.ts-plate b{display:block; font-family:var(--disp); font-weight:400; font-size:16px;}
.ts-hero{position:absolute; left:50%; bottom:calc(46px + var(--lift)); width:204px; margin-left:-115px;}
.ts-hero svg{display:block; width:100%; height:auto; overflow:visible;}
.wf{visibility:hidden; animation:wf .72s linear infinite both;}
@keyframes wf{0%{visibility:visible;}12.5%{visibility:hidden;}100%{visibility:hidden;}}
.ts-dust{animation:dust .72s linear infinite; opacity:0;}
@keyframes dust{0%{transform:translate(0,0) scale(.5); opacity:.55;}100%{transform:translate(-26px,-6px) scale(1.4); opacity:0;}}
.ts-cheer{display:none;}
.ts-logo{position:absolute; left:0; right:0; top:calc(12vh + env(safe-area-inset-top,0px)); text-align:center; animation:tsDrop .8s cubic-bezier(.3,1.5,.5,1) both;}
.ts-logo svg{display:block; width:min(86%,400px); height:auto; margin:0 auto;}
.ts-sub{display:inline-block; margin-top:2px; font-family:var(--disp); font-size:18px; letter-spacing:.04em; background:#2B2138; color:#FFF3B0; padding:2px 16px 3px; border-radius:999px;}
@keyframes tsDrop{from{transform:translateY(-40px); opacity:0;}to{transform:none; opacity:1;}}
.ts-info{position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); font-size:13px; font-weight:700; background:rgba(20,14,34,.35); padding:2px 10px; border-radius:999px;}
.ts-day{left:14px;} .ts-ver{right:14px; font-weight:500;}
.ts-tap{position:absolute; left:0; right:0; bottom:calc(16px + var(--lift) * .55 + env(safe-area-inset-bottom,0px)); text-align:center; font-family:var(--disp); font-size:21px; color:#fff;
  text-shadow:0 2px 0 #2B2138,0 -2px 0 #2B2138,2px 0 0 #2B2138,-2px 0 0 #2B2138; animation:tsTap 1.6s ease-in-out 1s infinite both;}
@keyframes tsTap{0%,100%{opacity:1;}50%{opacity:.35;}}
#title.go .ts-l,#title.go .ts-dust{animation-play-state:paused;}
#title.go .ts-walk{display:none;}
#title.go .ts-cheer{display:block;}
#title.go .ts-tap{animation:none; opacity:0; transition:opacity .2s;}
.ts-burst{transform-box:fill-box; transform-origin:center; animation:burst .35s ease-out both;}
@keyframes burst{from{transform:scale(.2); opacity:0;}60%{opacity:1;}to{transform:scale(1); opacity:1;}}
#tsflash{position:fixed; inset:0; z-index:95; background:#FFFDF2; opacity:0; pointer-events:none; transition:opacity .2s ease;}
#tsflash[hidden]{display:none;}
#tsflash.on{opacity:1;}

/* 모험지·보스 움직임 (.live 안에서만) */
.an-flag,.an-fire,.an-blink,.an-bridge,.an-breathe,.an-aura,.an-ring,.an-sway,.an-leaf{transform-box:fill-box;}
.an-leaf,.an-ring,.an-glow{display:none;}
.live .an-flag{transform-origin:0 50%; animation:anFlag 1.1s ease-in-out infinite alternate;}
@keyframes anFlag{from{transform:skewY(7deg) scaleX(1);}to{transform:skewY(-7deg) scaleX(.8);}}
.live .an-fire{transform-origin:50% 100%; animation:anFire .32s ease-in-out infinite alternate;}
.live .an-fire.b{animation-duration:.27s; animation-delay:-.13s;}
@keyframes anFire{0%{transform:scale(1,1) skewX(0);}50%{transform:scale(.88,1.16) skewX(5deg);}100%{transform:scale(1.06,.92) skewX(-5deg);}}
.live .an-glow{display:inline; animation:anGlow .5s ease-in-out infinite alternate;}
@keyframes anGlow{from{opacity:.25;}to{opacity:.6;}}
.live .an-blink{transform-origin:50% 50%; animation:anBlink 3.6s ease-in-out infinite;}
@keyframes anBlink{0%,88%,100%{transform:scaleY(1);}92%{transform:scaleY(.08);}95%{transform:scaleY(1);}97%{transform:scaleY(.1);}}
.live .an-bridge{transform-origin:50% 0; animation:anBridge 2.4s ease-in-out infinite alternate;}
@keyframes anBridge{from{transform:rotate(-2.2deg) translateY(0);}to{transform:rotate(2.2deg) translateY(1.5px);}}
.live .an-water{animation:anWater 1.4s linear infinite;}
@keyframes anWater{to{stroke-dashoffset:-20;}}
.live .an-sway{transform-origin:50% 100%; animation:anSway 2.8s ease-in-out infinite alternate;}
.live .an-sway.b{animation-duration:3.4s; animation-delay:-1.2s;}
@keyframes anSway{from{transform:rotate(-2deg);}to{transform:rotate(2deg);}}
.live .an-leaf{display:inline; animation:anLeaf 4.2s linear infinite; opacity:0;}
@keyframes anLeaf{0%{transform:translate(0,0) rotate(0); opacity:0;}10%{opacity:1;}50%{transform:translate(-7px,22px) rotate(160deg);}85%{opacity:1;}100%{transform:translate(4px,44px) rotate(320deg); opacity:0;}}
.live .an-bolt{animation:anBolt 3.8s linear infinite;}
@keyframes anBolt{0%,70%{opacity:0;}72%{opacity:1;}75%{opacity:.2;}78%{opacity:1;}88%,100%{opacity:0;}}
.live .an-flash{animation:anFlash 3.8s linear infinite;}
@keyframes anFlash{0%,70%,100%{opacity:0;}72%,78%{opacity:.35;}75%{opacity:.05;}86%{opacity:0;}}
.an-flash{opacity:0;}
.live .an-bolt polyline{--b2:inline;}
.live .an-aura{transform-origin:50% 50%; animation:anAura 2.2s ease-in-out infinite alternate;}
@keyframes anAura{from{transform:scale(.94); opacity:.5;}to{transform:scale(1.08); opacity:.85;}}
.live .an-ring{display:inline; transform-origin:50% 50%; animation:anRing 2.6s ease-out infinite;}
.live .an-ring.b{animation-delay:-1.3s;}
@keyframes anRing{from{transform:scale(.7); opacity:.9;}to{transform:scale(1.35); opacity:0;}}
.live .an-breathe{transform-origin:50% 100%; animation:anBreathe 2.6s ease-in-out infinite alternate;}
@keyframes anBreathe{from{transform:scale(1,1);}to{transform:scale(1.025,1.045);}}
/* 지도 날씨 */
.mapwx{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
.mapwx .ts-bolt{animation-duration:9s;}
.mapwx .mapfog{position:absolute; inset:0; background:radial-gradient(ellipse 60% 9% at 30% 18%,rgba(245,248,250,.75),transparent 70%),radial-gradient(ellipse 60% 9% at 75% 42%,rgba(245,248,250,.7),transparent 70%),radial-gradient(ellipse 60% 9% at 25% 66%,rgba(245,248,250,.7),transparent 70%),radial-gradient(ellipse 60% 9% at 70% 88%,rgba(245,248,250,.7),transparent 70%); animation:fogDrift 14s ease-in-out infinite alternate;}
@keyframes fogDrift{from{transform:translateX(-6%);}to{transform:translateX(6%);}}
@media (prefers-reduced-motion: reduce){
  .live .an-flag,.live .an-fire,.live .an-glow,.live .an-blink,.live .an-bridge,.live .an-water,.live .an-sway,.live .an-leaf,.live .an-bolt,.live .an-flash,.live .an-aura,.live .an-ring,.live .an-breathe,.mapwx .mapfog{animation:none;}
  .live .an-leaf,.live .an-ring{display:none;}
}

/* 보스전 타격 연출 */
.battle{position:fixed; left:50%; top:calc(60px + env(safe-area-inset-top,0px)); transform:translateX(-50%) translateY(-6px); width:calc(100% - 24px); max-width:400px; z-index:45; pointer-events:none;
  background:var(--surface); border:2px solid var(--line); border-radius:18px; box-shadow:0 6px 0 var(--edge); padding:8px 10px 10px; opacity:0; transition:opacity .15s ease, transform .15s ease;}
.battle[hidden]{display:none;}
.battle.on{opacity:1; transform:translateX(-50%) translateY(0);}
.bt-stage{position:relative; height:112px; margin-top:6px; border-radius:12px; background:var(--soft);}
.bt-ground{position:absolute; left:0; right:0; bottom:0; height:9px; background:var(--line); border-radius:0 0 12px 12px;}
.bt-hero{position:absolute; left:7%; bottom:5px; width:66px;}
.bt-hero>div{position:absolute; left:0; bottom:0; width:100%;}
.bt-hero>.h-idle{position:relative;}
.bt-hero svg,.bt-bossi svg{display:block; width:100%; height:auto; overflow:visible;}
.bt-boss{position:absolute; right:7%; bottom:5px; width:84px;}
.bt-bossi{position:relative;}
.bt-bossi .b-dead{position:absolute; left:0; top:0; width:100%; opacity:0;}
.bt-boom{position:absolute; left:50%; top:42%; width:104px; height:104px; margin:-52px 0 0 -52px; border-radius:50%; opacity:0; pointer-events:none;
  background:radial-gradient(circle,#FFF6C8 0%,#FFD04D 28%,rgba(255,128,40,.85) 52%,rgba(255,80,40,0) 72%);}
.battle.go .bt-boom{animation:btBoom .6s ease-out .2s forwards;}
@keyframes btBoom{0%{opacity:0; transform:scale(.2);}10%{opacity:.95; transform:scale(.8);}100%{opacity:0; transform:scale(1.8);}}
.bt-slash{position:absolute; left:2%; top:4%; width:96%; height:92%; opacity:0; overflow:visible;}
.bt-slash path{stroke-dasharray:1; stroke-dashoffset:1; fill:none; stroke-linecap:round;}
.bt-dmg{position:absolute; left:50%; top:-24px; transform:translateX(-50%); opacity:0; font-family:var(--disp); font-size:28px; line-height:1; color:#fff; white-space:nowrap;
  text-shadow:0 2px 0 #2B2138,0 -2px 0 #2B2138,2px 0 0 #2B2138,-2px 0 0 #2B2138,2px 2px 0 #2B2138,-2px -2px 0 #2B2138,2px -2px 0 #2B2138,-2px 2px 0 #2B2138;}
.battle.final .bt-dmg{color:var(--gold); font-size:34px;}
.battle .h-atk,.battle .h-win{opacity:0;}
.bt-hp{display:flex; align-items:center; gap:8px; margin-top:8px;}
.bt-name{font-family:var(--disp); font-size:15px; color:var(--boss); white-space:nowrap;}
.bt-bar{position:relative; flex:1; height:14px; border-radius:7px; background:var(--soft); border:2px solid var(--line); overflow:hidden;}
.bt-bar i{position:absolute; left:0; top:0; bottom:0; border-radius:5px;}
.bt-bar .g{background:#fff; opacity:.9; transition:width .5s ease .5s;}

.an-spark,.an-chip{transform-box:fill-box;}

function Q(p,t,w,f,o){o=o||{};return {p:p,t:t,w:w,f:f,ah:o.ah,lh:o.lh,fd:o.fd,h:o.h};}
function ik(root,tgt,l1,l2,hint){
  var dx=tgt[0]-root[0],dy=tgt[1]-root[1],d=Math.sqrt(dx*dx+dy*dy)||0.001,mx_=l1+l2-0.5,ex=tgt[0],ey=tgt[1];
  if(d>mx_){ex=root[0]+dx/d*mx_;ey=root[1]+dy/d*mx_;d=mx_;dx=ex-root[0];dy=ey-root[1];}
  var a=(l1*l1-l2*l2+d*d)/(2*d),h=Math.sqrt(Math.max(0,l1*l1-a*a));
  var mx=root[0]+a*dx/d,my=root[1]+a*dy/d;
  var s1=[mx+h*dy/d,my-h*dx/d],s2=[mx-h*dy/d,my+h*dx/d];
  var d1=(s1[0]-root[0])*hint[0]+(s1[1]-root[1])*hint[1],d2=(s2[0]-root[0])*hint[0]+(s2[1]-root[1])*hint[1];
  return {m:d1>=d2?s1:s2,e:[ex,ey]};
}
function segsOf(q){
  var r=q.t*Math.PI/180,dir=[Math.cos(r),-Math.sin(r)],P=q.p;
  var N=[P[0]+30*dir[0],P[1]+30*dir[1]],H=q.h||[N[0]+9*dir[0],N[1]+9*dir[1]];
  var ah=q.ah||[-1,0.3],A=[ik(N,q.w[0],15,14,ah),ik(N,q.w[1],15,14,ah)];
  var L=[0,1].map(function(i){return ik(P,q.f[i],23,23,(q.lh&&q.lh[i])||[1,0]);});
  var T=[0,1].map(function(i){var fd=(q.fd&&q.fd[i])||[7,0];return [L[i].e[0]+fd[0],L[i].e[1]+fd[1]];});
  function s(a,b){return [a[0],a[1],b[0],b[1]];}
  return {
    segs:[
      {c:'f',w:4,v:s(N,A[1].m)},{c:'f',w:4,v:s(A[1].m,A[1].e)},
      {c:'f',w:5,v:s(P,L[1].m)},{c:'f',w:5,v:s(L[1].m,L[1].e)},{c:'f',w:4,v:s(L[1].e,T[1])},
      {c:'n',w:7,v:s(P,N)},
      {c:'n',w:5,v:s(P,L[0].m)},{c:'n',w:5,v:s(L[0].m,L[0].e)},{c:'n',w:4,v:s(L[0].e,T[0])},
      {c:'n',w:4,v:s(N,A[0].m)},{c:'n',w:4,v:s(A[0].m,A[0].e)}
    ],
    H:H, hand:A[0].e
  };
}
function r1(x){return Math.round(x*10)/10;}
function figSvg(def,animated,label){
  var poses=def.poses, n=poses.length, S=poses.map(segsOf), dur=def.dur||(1.3*n), i,k;
  var ks=[],kt=[];
  for(i=0;i<=n;i++){kt.push((i/n).toFixed(3));}
  for(i=0;i<n;i++){ks.push('.45 0 .55 1');}
  function an(attr,vals){
    return '<animate attributeName="'+attr+'" values="'+vals.map(r1).join(';')+'" keyTimes="'+kt.join(';')+'" calcMode="spline" keySplines="'+ks.join(';')+'" dur="'+dur+'s" repeatCount="indefinite"/>';
  }
  var out='<svg class="fig" viewBox="0 0 220 124" role="img" aria-label="'+label+' 동작 그림">';
  out+='<line x1="8" y1="111" x2="212" y2="111" stroke="var(--line)" stroke-width="2"/>';
  out+=(def.props||'');
  var names=['x1','y1','x2','y2'];
  function line(color,w,idx){
    var v=S[0].segs[idx].v, o='<line x1="'+r1(v[0])+'" y1="'+r1(v[1])+'" x2="'+r1(v[2])+'" y2="'+r1(v[3])+'" stroke="'+color+'" stroke-width="'+w+'" stroke-linecap="round">';
    if(animated&&n>1){
      for(var c=0;c<4;c++){
        var vals=S.map(function(s){return s.segs[idx].v[c];}); vals.push(S[0].segs[idx].v[c]);
        o+=an(names[c],vals);
      }
    }
    return o+'</line>';
  }
  for(k=0;k<5;k++){out+=line('var(--muted)',S[0].segs[k].w,k);}
  if(def.tie){
    var t0=S[0].hand, o='<line x1="'+r1(t0[0])+'" y1="'+r1(t0[1])+'" x2="'+def.tie[0]+'" y2="'+def.tie[1]+'" stroke="var(--marker)" stroke-width="3" stroke-linecap="round">';
    if(animated&&n>1){
      var hx=S.map(function(s){return s.hand[0];});hx.push(S[0].hand[0]);
      var hy=S.map(function(s){return s.hand[1];});hy.push(S[0].hand[1]);
      o+=an('x1',hx)+an('y1',hy);
    }
    out+=o+'</line>';
  }
  for(k=5;k<11;k++){out+=line('var(--ink)',S[0].segs[k].w,k);}
  var h0=S[0].H, hc='<circle cx="'+r1(h0[0])+'" cy="'+r1(h0[1])+'" r="7.5" fill="var(--ink)">';
  if(animated&&n>1){
    var cx=S.map(function(s){return s.H[0];});cx.push(S[0].H[0]);
    var cy=S.map(function(s){return s.H[1];});cy.push(S[0].H[1]);
    hc+=an('cx',cx)+an('cy',cy);
  }
  out+=hc+'</circle></svg>';
  return out;
}

  if(reduce){

  }
  return '<div class="figs">'+figSvg(def,true,name)+'</div>';
}

function bStar(cx,cy,r,fill){
  var p=[],i,a,rr;
  for(i=0;i<10;i++){a=(-90+36*i)*Math.PI/180; rr=(i%2===0)?r:r*0.45; p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}

/* 근육 팔: 어깨(sx,sy) → 팔꿈치(ex,ey) → 손(hx,hy), 이두근 볼록 */
function mArm(sx,sy,hx,hy,ex,ey,o){
  o=o||{};
  var w=o.w||15, f=o.f||SKIN, s='';
  if(ex==null){ex=(sx+hx)/2; ey=(sy+hy)/2;}
  s+=bLimb(sx,sy,ex,ey,w,f)+bLimb(ex,ey,hx,hy,w-3,f);
  var bx=sx+(ex-sx)*0.55, by=sy+(ey-sy)*0.55, ang=Math.atan2(ey-sy,ex-sx)*180/Math.PI;
  s+='<ellipse cx="'+bx+'" cy="'+by+'" rx="'+(w*0.85)+'" ry="'+(w*0.62)+'" transform="rotate('+ang+' '+bx+' '+by+')" fill="'+f+'" stroke="'+OL+'" stroke-width="2.5"/>';
  s+=circ(hx,hy,o.fr||8,f,2.5);
  return s;
}

}

function heroArtBase(o){
  var s='', i, lg=o.legs, ar=o.arms, ex=o.expr, eq=o.eq||curEq();
  s+=capeArt(eq.cape);
  for(i=0;i<2;i++){
    var hx=(i===0?-10:10);
    s+=bLimb(hx,20,lg[i][0],lg[i][1],15,SKIN)+
       bootArt(lg[i][0],lg[i][1],eq.shoes?eq.shoes.fill:'#24356B',!!eq.shoes);
  }
  s+=mTorso(SKIN,SKIN_D);
  s+=pth('M-21,13 L21,13 L19,32 L0,26 L-19,32 Z','#3F6FCB')+
     '<rect x="-21" y="11" width="42" height="6" rx="3" fill="#F6C445" stroke="'+OL+'" stroke-width="2.5"/>';
  if(eq.robe) s+=robeArt();
  if(eq.armor) s+=armorArt(eq.armor);
  for(i=0;i<2;i++){
    var sx=(i===0?-30:30), a=ar[i];
    s+=mArm(sx,-10,a[0],a[1],a[2],a[3],{w:18,fr:9});
    s+='<circle cx="'+(a[0]+(sx>0?0:0))+'" cy="'+a[1]+'" r="3" fill="#F6C445" stroke="none"/>';
  }
  for(i=0;i<2;i++){
    var px=(i===0?-32:32);
    s+=circ(px,-15,9,eq.armor?eq.armor.fill:'#8FB3EA',2.6)+circ(px,-15,2.6,eq.armor&&eq.armor.trim?eq.armor.trim:'#F6C445',1.8);
  }
  if(eq.pillow) s+=pillowArt(ar[0][0]-2,ar[0][1]+2);
  if(eq.shield) s+=shieldArt(eq.shield,ar[0][0],ar[0][1]);
  if(o.sword) s+=swordArt(o.sword[0],o.sword[1],o.sword[2],eq.sword);
  s+='<g transform="translate(0,-11) scale(.93)">';
  s+='<circle cx="0" cy="-38" r="27" fill="'+FACE+'" stroke="'+OL+'" stroke-width="3"/>';
  s+=(eq.helm?helmArt(eq.helm):'<path d="M-28,-40 A28,28 0 0 1 28,-40 Q0,-48 -28,-40 Z" fill="#6E9BD8" stroke="'+OL+'" stroke-width="3" stroke-linejoin="round"/>')+
     plumeArt(eq.plume);
  s+=faceArt(ex);
  s+='<ellipse cx="-19" cy="-20" rx="5.5" ry="3.5" fill="#FF8FA3" opacity=".7"/><ellipse cx="19" cy="-20" rx="5.5" ry="3.5" fill="#FF8FA3" opacity=".7"/>';
  if(eq.mask) s+=maskArt(eq.mask);
  s+='</g>';
  return s;
}

/* ---------- 결과 판정 (중간보스 · 마왕 · 몸짱신) ---------- */
var BOSSES={mon:{k:'ogre',n:'상체짱 오우거'},tue:{k:'spider',n:'하체짱 왕거미'},wed:{k:'golem',n:'코어짱 골렘'},thu:{k:'wolf',n:'어깨짱 워울프'},fri:{k:'mino',n:'벅지짱 미노타우르스'},sat:{k:'demon',n:'전신짱 마왕'}};
var SAT_GOAL=1000;
var AUTOEND=true;   /* v1.36 자동 모험 종료. false면 예전 규칙으로 계산해요(소급 적용 전후 비교용) */
function isEnded(k){
  var L=S.log[k]; if(L && L.ended) return true;
  return AUTOEND && k<fmt(TODAY);
}
function inPlay(k){ return k>=S.start || !!S.log[k]; }
function weekMonOf(d){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)); }
function questWeekXP(d){
  var mon=weekMonOf(d), t=0, i;
  for(i=0;i<5;i++){ t+=dayXP(fmt(addDays(mon,i))); }
  return t;
}
function weekdayXP(d){ return questWeekXP(d)+trainGrantedWeek(weekMonOf(d)); }
function satWin(d){return weekdayXP(d)>=SAT_GOAL;}
/* 일요일 가호: 스트레칭을 모두 마치고 모험이 종료돼야 받아요. 이미 받은 가호·의상(restLog)은 그대로 인정해요 */
function sunBless(k){
  var L=rd(k);
  if(!AUTOEND) return !!L.ended;
  if(S.restLog && S.restLog[k]!==undefined) return true;
  return isEnded(k) && isDone(parse(k));
}
function dayResult(d){
  var k=fmt(d), dk=DK[d.getDay()], L=rd(k), done=isDone(d), en=isEnded(k);
  if(dk==='sun') return sunBless(k)?{res:'bless'}:null;
  if(dk==='sat'){
    var x=weekdayXP(d);
    if(done) return {res:x>=SAT_GOAL?'win':'lose',xp:x,why:x>=SAT_GOAL?'':'xp'};
    if(en && (L.ended || inPlay(k))) return {res:'lose',xp:x,why:'ended'};
    return null;
  }
  if(done) return {res:'win'};
  if(en && (L.ended || inPlay(k))) return {res:'lose',why:'ended'};
  return null;
}
function resLabel(dk,res){
  if(dk==='sun') return '가호';
  if(dk==='sat') return res==='win'?'승리':'패배';
  return res==='win'?'토벌 완료':'토벌 실패';
}

      b:battleScene(B.k,'win')+rewardNote(d,'win')+'<p class="bnote">'+(dk==='sat'?'월~금 누적 '+r.xp+' XP로 마왕성을 돌파! '+B.n+eul(B.n)+' 쓰러뜨렸어요. 승리 보너스 +150 XP · 전리품 상자 1개 획득! 여관에서 열어 보세요':'몸짱용사가 '+B.n+eul(B.n)+' 쓰러뜨렸어요! 토벌 보너스 +'+MID_XP+' XP')+'</p>',mode:'win'};

/* 그 주의 훈련 XP가 아직 월~금 누적에 들어갈 수 있는지 (토요일 마왕성 판정 전까지) */
function trainOpenWeek(d){
  var sat=addDays(weekMonOf(d),5), sk=fmt(sat), tk=fmt(TODAY);
  if(sk<tk) return false;
  if(sk===tk) return !dayResult(sat);
  return true;
}
function trAdd(id,delta){
  if(!trainBuilt() || !trainDayOpen()) return false;
  var k=fmt(TODAY);
  if(!S.trainLog) S.trainLog={};
  var e=S.trainLog[k]; if(!e) e=S.trainLog[k]={sets:{},run:0,es:0,er:0};
  var cur=e.sets[id]||0, nx=cur+delta;
  if(nx<0 || nx>TR_MAX) return false;
  var earned=(delta>0 && trainEarnNow());
  if(earned) e.es=(e.es||0)+1;
  if(nx===0) delete e.sets[id]; else e.sets[id]=nx;
  if(delta<0) e.es=Math.min(e.es||0,trSetCount(e));
  if(!e.h) e.h=[];
  if(delta>0){ e.h.push(id+':'+(earned?1:0)); if(e.h.length>80) e.h.shift(); }
  else { var hi=e.h.map(function(x){return x.split(':')[0];}).lastIndexOf(id); if(hi>=0) e.h.splice(hi,1); }
  save(); return true;
}
function trRun(){
  if(!trainBuilt() || !trainDayOpen()) return false;
  var k=fmt(TODAY);
  if(!S.trainLog) S.trainLog={};
  var e=S.trainLog[k]; if(!e) e=S.trainLog[k]={sets:{},run:0,es:0,er:0};
  if(e.run>=TR_MAX) return false;
  var earnedRun=trainEarnNow();
  e.run=(e.run||0)+1; if(earnedRun) e.er=(e.er||0)+1;
  if(!e.h) e.h=[]; e.h.push('run:'+(earnedRun?1:0)); if(e.h.length>80) e.h.shift();
  save(); return true;
}
function trLast(){
  var e=S.trainLog && S.trainLog[fmt(TODAY)]; if(!e || !e.h || !e.h.length) return null;
  var p=e.h[e.h.length-1].split(':'), id=p[0];
  return {id:id,name:(id==='run'?'자유 러닝':(X[id]?X[id].n:id)),unit:(id==='run'?'회':'세트')};
}
function trUndo(){
  var k=fmt(TODAY), e=S.trainLog && S.trainLog[k]; if(!e || !e.h || !e.h.length) return null;
  var last=e.h.pop(), p=last.split(':'), id=p[0], earned=(p[1]==='1'), n;
  if(id==='run'){ e.run=Math.max(0,(e.run||0)-1); if(earned) e.er=Math.max(0,(e.er||0)-1); }
  else { n=(e.sets[id]||0)-1; if(n>0) e.sets[id]=n; else delete e.sets[id]; if(earned) e.es=Math.max(0,(e.es||0)-1); }
  e.es=Math.min(e.es||0,trSetCount(e)); e.er=Math.min(e.er||0,e.run||0);
  save(); return id;
}

/* ---------- 대장간 · 장비재료 · 제작 장비 (v1.37) ---------- */
var RECIPE={n:5,r:4,l:3};
var MATN={n:'일반',r:'희귀',l:'전설'};
function hashStr(str){ var h=2166136261, i; for(i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rngFor(str){ var a=hashStr(str); return function(){ a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function matRoll(rnd,minRare){ var x=rnd()*100; if(minRare) return x<75?'r':'l'; return x<60?'n':(x<90?'r':'l'); }
/* 날짜로 결과가 고정되는 재료 드랍: 중간보스 1개, 마왕 3개(마지막 1개는 희귀 이상 확정) */
function dropsOfDay(k,force){
  var d=parse(k), dk=DK[d.getDay()], o={n:0,r:0,l:0};
  if(dk==='sun') return o;
  var r=dayResult(d); if(!r || r.res!=='win') return o;
  if(!force && !isEnded(k)) return o;
  var rnd=rngFor('momjjang-forge:'+k), cnt=(dk==='sat')?3:1, i;
  for(i=0;i<cnt;i++){ o[matRoll(rnd,dk==='sat' && i===cnt-1)]++; }
  return o;
}
function forgeStats(){
  var earned={n:0,r:0,l:0}, spent={n:0,r:0,l:0};
  Object.keys(S.log).forEach(function(k){ var o=dropsOfDay(k,false); earned.n+=o.n; earned.r+=o.r; earned.l+=o.l; });
  ITEMS.forEach(function(it){ if(it.craft && S.inv && S.inv[it.id]) spent[it.rar]+=RECIPE[it.rar]; });
  return {earned:earned, spent:spent, bal:{n:Math.max(0,earned.n-spent.n),r:Math.max(0,earned.r-spent.r),l:Math.max(0,earned.l-spent.l)}};
}
function dropText(o){ var t=[]; ['n','r','l'].forEach(function(g){ if(o[g]>0) t.push(MATN[g]+' 재료 +'+o[g]); }); return t.join(' · '); }
function rewardNote(d,res){
  var k=fmt(d), dk=DK[d.getDay()], parts=[], dr, mat;
  if(dk==='sun') return '';
  mat=matOfDay(k); if(mat>0) parts.push('건축 자재 +'+mat);
  if(res==='win'){ dr=dropText(dropsOfDay(k,true)); if(dr) parts.push(dr); }
  if(!parts.length) return '';
  return '<p class="bnote drops">'+parts.join(' · ')+'</p>'+(isEnded(k)?'':'<p class="bnote" style="margin-top:2px">모험을 종료하면 창고에 들어와요</p>');
}

function forgePanel(){
  var fs=forgeStats(), h='';
  h+='<p class="note" style="margin:0 2px 12px">중간보스를 토벌하면 재료 1개, 마왕을 토벌하면 3개(희귀 이상 1개 확정)를 얻어요. 같은 등급의 재료로 같은 등급 장비를 골라서 만들어요. 필요한 재료: 일반 '+RECIPE.n+' · 희귀 '+RECIPE.r+' · 전설 '+RECIPE.l+'개</p>';
  var list=ITEMS.filter(function(it){return it.craft;}), idx={};
  list.forEach(function(it,i){ idx[it.id]=i; });
  function rank(it){ return (S.inv&&S.inv[it.id])?2:(fs.bal[it.rar]>=RECIPE[it.rar]?0:1); }
  list.sort(function(a,b){ return (rank(a)-rank(b))||(idx[a.id]-idx[b.id]); });
  list.forEach(function(it){
    var have=!!(S.inv&&S.inv[it.id]), need=RECIPE[it.rar], bal=fs.bal[it.rar], worn=!!(S.eq&&S.eq[it.slot]===it.id), act;
    if(have) act='<button type="button" class="ghost" data-a="equip" data-id="'+it.id+'">'+(worn?'벗기':'입기')+'</button>';

    else act='<button type="button" class="ghost" disabled>'+MATN[it.rar]+' 재료 '+(need-bal)+'개 더 필요</button>';
    h+='<div class="fgitem r-'+it.rar+(have?' have':'')+'"><div class="fgi">'+itemIcon(it,true)+'</div><div class="fgt"><b>'+it.name+'</b><small>'+MATN[it.rar]+' · '+SLOTN[it.slot]+'</small><small>'+(have?(worn?'착용 중':'제작 완료'):MATN[it.rar]+' 재료 '+need+'개')+'</small></div><div class="fgact">'+act+'</div></div>';
  });
  return h;
}

  if(x===0) return '<span class="rew none">XP 없음</span>';
  return '<span class="rew">+'+x+' XP</span>';
}
function check(on,label,sub,act,extra,dis,rew){
  return '<button type="button" class="row" aria-pressed="'+(on?'true':'false')+'" data-a="'+act+'" '+extra+(dis?' disabled':'')+'>'+
    '<span class="box" aria-hidden="true">✓</span>'+
    '<span class="rt">'+label+(sub?'<span class="rs">'+sub+'</span>':'')+'</span>'+(rew!=null?rewChip(rew,on):'')+'</button>';
}
function kmEntries(){
  return Object.keys(S.log).filter(function(k){return S.log[k].km>0;}).sort().map(function(k){return {k:k,v:S.log[k].km};});
}
function kmSum(a,b){
  var t=0; kmEntries().forEach(function(e){ if((!a||e.k>=a)&&(!b||e.k<=b)) t+=e.v; }); return t;
}
function kmFmt(x){return (Math.round(x*100)/100).toFixed(2);}
function runRow(on,label,sub,rew){
  return '<div class="row" aria-pressed="'+(on?'true':'false')+'"><span class="box" aria-hidden="true">✓</span><span class="rt">'+label+(sub?'<span class="rs">'+sub+'</span>':'')+'</span>'+rewChip(rew,on)+'</div>';
}
function kmRow(L,rest,lock){
  return '<div class="kmrow"><label for="kmin">'+(rest?'오늘 걸은 거리':'실제로 뛴 거리')+'</label>'+
    '<input id="kmin" type="number" inputmode="decimal" step="0.01" min="0" max="200" placeholder="5.00" value="'+(L.km>0?L.km:'')+'"'+(lock?' disabled':'')+'><span>km</span></div>'+((!rest&&L.km>0&&L.km<RUN_MIN&&!L.done.run)?'<p class="note" style="margin:-6px 4px 10px">'+RUN_MIN+'km 이상 입력해야 러닝이 완료돼요</p>':'');
}
function dayNav(d){
  var pv=addDays(d,-1), nx=addDays(d,1), isT=(fmt(d)===fmt(TODAY));
  function lab(x){var dk=DK[x.getDay()]; return (x.getMonth()+1)+'/'+x.getDate()+' '+PLAN[dk].k+' · '+QN[dk];}
  return '<div class="daynav"><button type="button" class="dn" data-a="prev"><span>‹ 전날</span><small>'+lab(pv)+'</small></button>'+
    (isT?'':'<button type="button" class="dn today" data-a="today">오늘로</button>')+
    '<button type="button" class="dn" data-a="next"><span>다음날 ›</span><small>'+lab(nx)+'</small></button></div>';
}
function hud(){
  var li=lvInfo(totalXP()), p=Math.round(li.cur*100/li.need);
  return '<section class="hud" aria-label="내 레벨"><div class="lv" aria-hidden="true"><span>LV</span><b>'+li.L+'</b></div>'+
    '<div class="hud-main"><div class="hud-top"><span class="ttl">'+titleOf(li.L)+'</span><span class="stk">연속 <b>'+streak()+'</b>일</span></div>'+

    '<div class="xpt"><span>'+li.cur+' / '+li.need+' XP</span><span>다음 레벨까지 '+(li.need-li.cur)+'</span></div></div></section>';

/* ---------- 주간 퀘스트: 월~금 누적 XP로 이번 주 마왕성 도전 가능 여부 확인 ---------- */
function dayMaxXP(d){ return XP_RUN+(count(d).total-1)*XP_SET+3*XP_MEAL+XP_CLEAR+MID_XP; }
function weekQuest(d){
  var mon=addDays(d,-((d.getDay()+6)%7)), tk=fmt(TODAY), cur=0, mx=0, days=[], i, allOver=true;
  for(i=0;i<5;i++){
    var x=addDays(mon,i), k=fmt(x), L=rd(k), xp=dayXP(k), over=!!(L.ended || k<tk);
    cur+=xp; mx+=over?xp:Math.max(xp,dayMaxXP(x));
    if(!over) allOver=false;
    days.push({lab:DAYS[x.getDay()], xp:xp, isT:(k===tk), done:isDone(x), fut:(k>tk && !xp)});
  }
  var tg=trainGrantedWeek(mon); cur+=tg; mx+=tg;
  return {mon:mon, fri:addDays(mon,4), cur:cur, mx:mx, days:days, allOver:allOver};
}
function weeklyHtml(d){
  var W=weekQuest(d), G=SAT_GOAL, pc=Math.min(100,Math.round(W.cur*100/G)), pot=Math.min(100,Math.round(W.mx*100/G)),
      st=(W.cur>=G)?'ok':(W.mx>=G?'go':'no'), msg, sub='', need=Math.max(0,G-W.cur),
      sp=(fmt(addDays(W.mon,5))<fmt(TODAY));   /* 그 주 토요일이 이미 지났는지 */
  var tOpen=trainOpenWeek(d), tBuilt=trainBuilt();
  if(st!=='ok' && tOpen && tBuilt){ st='go'; need=Math.max(0,G-W.cur); }
  if(st==='ok'){
    msg=sp?(G+' XP 달성 · 마왕성 도전 자격을 얻은 주였어요'):(W.allOver?(G+' XP 달성 · 마왕성에 도전할 수 있어요'):(G+' XP 달성! 토요일 마왕성에 도전할 수 있어요'));
    sub=sp?'':'마왕성에서 이기려면 토요일 퀘스트도 모두 완료해야 해요.';
  }else if(st==='go'){
    msg=need+' XP 더 필요해요';
    sub=(tOpen&&tBuilt)?'남은 날의 퀘스트와 훈련장 운동으로 채울 수 있어요. 훈련장 XP도 월~금 누적에 더해져요.':'남은 날을 모두 채우면 최대 +'+(W.mx-W.cur)+' XP · 마왕성 도전이 가능해요.';
  }else{
    msg=W.allOver?(W.cur+' XP로 '+G+' XP에 못 미'+(sp?'친 주였어요':'쳤어요')):('이번 주는 최대 '+W.mx+' XP라 마왕성 도전이 어려워요');
    sub=W.allOver?(sp?'마왕의 저주로 마왕성에서 패배한 주였어요.':'마왕의 저주로 마왕성에서는 패배하는 주예요.'):'남은 날을 모두 채워도 '+G+' XP에 닿지 못해요.';
    if(tOpen && !tBuilt) sub+=' 왕국에서 훈련장을 복구하면 XP를 보충할 수 있어요.';
  }
  var dd=W.days.map(function(x){
    return '<div class="wq-day'+(x.done?' done':'')+(x.isT?' cur':'')+(x.fut?' fut':'')+'"><small>'+x.lab+(x.isT?' · 오늘':'')+'</small><b>'+(x.fut?'–':x.xp)+'</b></div>';
  }).join('');
  return '<section class="weekq '+st+'" aria-label="주간 퀘스트"><div class="wq-top"><p class="wq-k">주간 퀘스트</p><span class="wq-range">'+(W.mon.getMonth()+1)+'/'+W.mon.getDate()+' ~ '+(W.fri.getMonth()+1)+'/'+W.fri.getDate()+'</span></div>'+
    '<div class="wq-xp"><span>월~금 누적 XP</span><b>'+W.cur+' <small>/ '+G+'</small></b></div>'+
    '<div class="wq-bar" role="progressbar" aria-label="주간 경험치" aria-valuemin="0" aria-valuemax="'+G+'" aria-valuenow="'+Math.min(W.cur,G)+'"><i class="pot" style="width:'+pot+'%"></i><i class="cur" style="width:'+pc+'%"></i></div>'+
    '<p class="wq-st">'+msg+'</p>'+(sub?'<p class="wq-sub">'+sub+'</p>':'')+'<div class="wq-days">'+dd+'</div></section>';
}

     '<div class="stat"><b>'+wxp+'</b><span>이번 주 획득 XP</span></div></div>';

      'aria-label="'+QN[dk]+', '+p.k+'요일 '+(d.getMonth()+1)+'/'+d.getDate()+', '+stat+(isT?', 오늘':'')+'">'+

  }
  h+='<div class="gmap">'+mapSvg(st,t,dead,live)+mapWeather()+btn+'</div><p class="note">스테이지를 누르면 그날의 퀘스트가 열려요.</p>';

function chart(pts,label,unit){
  if(pts.length<2) return '<p class="empty">'+label+' 기록이 2개 이상이면 그래프가 나타나요.</p>';
  var W=320,H=110,P=16, vs=pts.map(function(p){return p.v;});
  var mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  if(mn===mx){mn-=1;mx+=1;}
  var x=function(i){return P+i*(W-2*P)/(pts.length-1);};
  var y=function(v){return H-P-(v-mn)*(H-2*P)/(mx-mn);};
  var line=pts.map(function(p,i){return x(i).toFixed(1)+','+y(p.v).toFixed(1);}).join(' ');
  var dots=pts.map(function(p,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="3.5" fill="var(--clear)"/>';}).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+' 변화 그래프">'+
    '<polyline points="'+line+'" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+
    '<text x="'+P+'" y="12" font-size="10" fill="var(--muted)">'+mx+unit+'</text>'+
    '<text x="'+P+'" y="'+(H-2)+'" font-size="10" fill="var(--muted)">'+mn+unit+'</text></svg>';
}

  var o; try{o=JSON.parse(text);}catch(e){return {err:'백업 내용을 읽을 수 없어요. 파일이나 붙여넣은 글자를 확인해 주세요.'};}
  var d=(o&&o.data)?o.data:o;
  if(!d||typeof d!=='object'||!d.log||typeof d.log!=='object'||!Array.isArray(d.body)) return {err:'몸짱소울 백업이 아니에요.'};
  var ok=/^\d{4}-\d{2}-\d{2}$/, log={};
  Object.keys(d.log).forEach(function(k){
    var L=d.log[k];
    if(ok.test(k)&&L&&typeof L==='object'){
      log[k]={done:(L.done&&typeof L.done==='object')?L.done:{},diet:(L.diet&&typeof L.diet==='object')?L.diet:{},out:!!L.out};
      if(L.km>0) log[k].km=+L.km;
      if(L.ended) log[k].ended=true;
      if(L.cleared) log[k].cleared=true;
    }
  });
  migrateLog(log);
  var body=d.body.filter(function(b){return b&&ok.test(b.date)&&typeof b.weight==='number';}).map(function(b){return {date:b.date,weight:b.weight};});
  var start=(typeof d.start==='string'&&ok.test(d.start))?d.start:fmt(TODAY);
  var inv={}, eqm={}, rl={}, known={}, sl;
  ITEMS.forEach(function(it){known[it.id]=it;});
  if(d.inv&&typeof d.inv==='object') Object.keys(d.inv).forEach(function(id){ if(known[id]&&d.inv[id]) inv[id]=true; });
  if(d.eq&&typeof d.eq==='object') Object.keys(d.eq).forEach(function(sl2){ var id=d.eq[sl2]; if(known[id]&&inv[id]&&known[id].slot===sl2) eqm[sl2]=id; });
  if(d.restLog&&typeof d.restLog==='object') Object.keys(d.restLog).forEach(function(k3){ var v=d.restLog[k3]; if(ok.test(k3)&&(v==='none'||known[v])) rl[k3]=v; });
  var ksp={}, tlog={};
  ['wall','train','forge'].forEach(function(id){ var v=(d.kingdom&&d.kingdom.spent)?+d.kingdom.spent[id]:0; ksp[id]=(v>0)?Math.min(Math.floor(v),bld(id).cost):0; });
  var jsn2={}; if(d.jny&&d.jny.seen&&typeof d.jny.seen==='object') Object.keys(d.jny.seen).forEach(function(id){ if(d.jny.seen[id]&&JNYIDS[id]) jsn2[id]=true; });
  if(d.trainLog&&typeof d.trainLog==='object') Object.keys(d.trainLog).forEach(function(k4){
    var e=d.trainLog[k4]; if(!ok.test(k4)||!e||typeof e!=='object') return;
    var o={sets:{},run:Math.max(0,Math.min(parseInt(e.run,10)||0,TR_MAX)),es:0,er:0};
    if(e.sets&&typeof e.sets==='object') Object.keys(e.sets).forEach(function(id){ var n=parseInt(e.sets[id],10); if(X[id]&&n>0) o.sets[id]=Math.min(n,TR_MAX); });
    o.es=Math.max(0,Math.min(parseInt(e.es,10)||0,trSetCount(o))); o.er=Math.max(0,Math.min(parseInt(e.er,10)||0,o.run));
    o.h=[]; if(Array.isArray(e.h)) e.h.slice(-80).forEach(function(x){ var m=/^(\w+):([01])$/.exec(String(x)); if(m && (m[1]==='run' || X[m[1]])) o.h.push(m[1]+':'+m[2]); });
    tlog[k4]=o;
  });
  return {data:{start:start,log:log,body:body,inv:inv,eq:eqm,restLog:rl,chestOpened:Math.max(0,parseInt(d.chestOpened,10)||0),bonusXp:Math.max(0,parseInt(d.bonusXp,10)||0),kingdom:{spent:ksp},trainLog:tlog,jny:{seen:jsn2},char:(CHARN[d.char]?d.char:'hero')}};
}
function bkCheck(text){
  var r=bkParse((text||'').trim());
  if(r.err){bkErr=r.err; bkPending=null;} else{bkErr=''; bkPending=r.data;}
  render();
}
function bkFile(f){
  if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){bkCheck(String(fr.result||''));};
  fr.onerror=function(){bkErr='파일을 읽지 못했어요.'; render();};
  fr.readAsText(f);
}
function bkCopyFallback(){

  if(ok){bkStamp(); render(); toast('복사했어요');} else{toast('글자를 길게 눌러 직접 복사해 주세요');}

function bkAction(a){

    bkMode=(bkMode==='make')?null:'make'; bkText=bkBuild(); bkErr=''; bkPending=null; render();
  }else if(a==='bk-file'){
    try{
      var blob=new Blob([bkText],{type:'application/json'}), url=URL.createObjectURL(blob), an=document.createElement('a');
      an.href=url; an.download=bkName(); document.body.appendChild(an); an.click(); an.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},3000);
      bkStamp(); render(); toast('백업 파일을 저장했어요');
    }catch(e){ toast('파일 저장이 안 돼요. 글자로 복사를 써 주세요'); }
  }else if(a==='bk-share'){
    try{
      var f=new File([bkText],bkName(),{type:'application/json'});
      navigator.share({files:[f],title:'몸짱소울 백업'}).then(function(){bkStamp(); render();}).catch(function(){});
    }catch(e){ toast('공유가 안 돼요. 다른 방법을 써 주세요'); }
  }else if(a==='bk-copy'){
    try{
      navigator.clipboard.writeText(bkText).then(function(){bkStamp(); render(); toast('복사했어요');},bkCopyFallback);
    }catch(e){ bkCopyFallback(); }
  }else if(a==='bk-restore'){
    bkMode=(bkMode==='restore')?null:'restore'; bkErr=''; bkPending=null; render();
  }else if(a==='bk-check'){
    var ta=document.getElementById('bkpaste'); bkCheck(ta?ta.value:'');
  }else if(a==='bk-apply'){
    if(bkPending){ var ck2=S.cloudTs, cu2=S.uid, lb2=S.lastBackup; S=bkPending; S.cloudTs=ck2; S.uid=cu2; S.lastBackup=lb2; save(); bkPending=null; bkMode=null; sel=TODAY; render(); toast('기록을 복원했어요'); }

    bkPending=null; bkMode=null; bkErr=''; render();
  }
}

function tone(freq,start,len,vol){

    vol=vol*sndScale(); if(vol<0.0002) return;

    if(!AC) AC=new C();

    var t=AC.currentTime+start; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+len);

}

  Object.keys(keys).forEach(function(k){

  if(bgmOn()){ if(tsSoundTried) t='한 번 더 누르면 모험 시작'; else if(!BGM.running()) t='화면을 눌러 음악 켜기'; }
  if(tp.textContent!==t) tp.textContent=t;
}
function titleOpen(first){
  tsFirst=!!first; tsBusy=false; tsSoundTried=false;
  titleBuild(); titleEl.hidden=false;
  bgmSync(); setTimeout(tsTapUpdate,450); setTimeout(tsTapUpdate,1600);
  wxRefresh(false,function(changed){ if(changed && !titleEl.hidden && !tsBusy) titleBuild(true); wxAfter(changed); });
  try{ titleEl.focus({preventScroll:true}); }catch(e){}
}
function titleFinish(){
  titleEl.hidden=true; titleEl.innerHTML=''; titleEl.className='';
  bgmSync();
  if(tsFirst && !introSeen) introOpen();
  render(); sunPopup(); jnyCheck();
}
function titleGo(){
  if(tsBusy || titleEl.hidden) return;
  if(bgmOn() && !tsSoundTried && !BGM.running()){
    tsSoundTried=true;
    BGM.unlock().then(function(ok){ if(ok) BGM.play('title'); tsTapUpdate(); });
    tsTapUpdate();
    return;
  }
  tsBusy=true;
  if(reduceMotion()){ titleFinish(); return; }
  titleEl.classList.add('go');
  try{ if(!BGM.sfx('start',1.0,0.4)){ tone(784,0,0.12,0.07); tone(1047,0.1,0.28,0.08); } }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([30,40,30,40,60]); }catch(e){}
  setTimeout(function(){
    tsFlash.hidden=false; void tsFlash.offsetWidth; tsFlash.classList.add('on');
    setTimeout(function(){
      titleFinish();
      tsFlash.classList.remove('on');
      setTimeout(function(){ tsFlash.hidden=true; },240);
    },230);
  },340);
}
titleEl.addEventListener('click',titleGo);
titleEl.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); titleGo(); } });

sunSettle();
render();
bgmReady=true;
if(titleOn()) titleOpen(true); else { bgmSync(); wxRefresh(false,wxAfter); if(!introSeen) introOpen(); sunPopup(); jnyCheck(); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ wxRefresh(false,wxAfter); dayTick(); } });
setInterval(dayTick,30000);
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
